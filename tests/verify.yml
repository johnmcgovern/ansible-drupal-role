---
# Post-deploy smoke test. Read-only: asserts the deployed stack is actually
# serving Drupal rather than merely having had the tasks reported as changed.
#
#   ansible-playbook -i hosts tests/verify.yml

- name: Verify the deployed Drupal stack
  hosts: webservers
  become: true
  gather_facts: true

  # These are deliberately NOT named after the role variables. Play vars take
  # precedence over group_vars, so reusing the real names here would shadow the
  # deployed configuration and, for example, silently skip every TLS check on a
  # TLS-enabled host.
  vars:
    verify_base_path: "{{ drupal_base_path | default('/var/www/drupal') }}"
    verify_drush: "{{ verify_base_path }}/vendor/bin/drush"
    verify_webserver_type: "{{ webserver_type | default('nginx') }}"
    verify_webserver_user: "{{ webserver_user | default('www-data') }}"
    verify_sitename: "{{ webserver_sitename | default('127.0.0.1') }}"
    verify_max_body_size: "{{ webserver_max_body_size | default('64M') }}"
    verify_memory_limit: "{{ php_memory_limit | default('256M') }}"
    verify_tls_enabled: "{{ webserver_tls_enabled | default(false) | bool }}"
    # Status report items that cannot be resolved on Ubuntu 24.04. "GD library"
    # is a warning purely because GD lacks AVIF: neither Ubuntu's php8.3-gd nor
    # the ondrej PPA build has AVIF compiled in (verified by inspecting both
    # binaries), because noble's libgd3 is not built against libavif.
    # With php_gd_avif_build enabled the custom build resolves it, so the
    # allowlist empties and a GD warning becomes a failure again.
    verify_status_allowed: >-
      {{ [] if (php_gd_avif_build | default(false) | bool) else ['GD library'] }}
    verify_tls_staging: "{{ webserver_tls_staging | default(false) | bool }}"
    verify_gd_avif: "{{ php_gd_avif_build | default(false) | bool }}"
    verify_cron_enabled: "{{ drupal_cron_enabled | default(true) | bool }}"
    verify_backup_enabled: "{{ drupal_backup_enabled | default(true) | bool }}"
    verify_backup_path: "{{ drupal_backup_path | default('/var/backups/drupal') }}"
    # Live ACME dry-run renewal: slow, rate limited and intermittently flaky.
    # Enable with -e verify_check_renewal=true when you want it.
    verify_check_renewal: false
    # A staging certificate is signed by an untrusted CA by design, so chain
    # validation has to be off for those runs. Everything else is still checked.
    verify_validate_certs: "{{ not (webserver_tls_staging | default(false) | bool) }}"
    verify_site_url: >-
      {{ 'https://' ~ (webserver_sitename | default('127.0.0.1'))
         if (webserver_tls_enabled | default(false) | bool)
         else 'http://127.0.0.1' }}

  tasks:

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Assert the web server is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services[webserver_service].state == 'running'
        fail_msg: "{{ webserver_service }} is not running."
      vars:
        webserver_service: "{{ 'nginx.service' if verify_webserver_type == 'nginx' else 'apache2.service' }}"

    - name: Assert MariaDB is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['mariadb.service'].state == 'running'
        fail_msg: "mariadb is not running."

    - name: Detect the PHP-FPM service
      ansible.builtin.command:
        cmd: php -r "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;"
      register: verify_php_version
      changed_when: false

    - name: Assert PHP-FPM is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services[fpm_service].state == 'running'
        fail_msg: "{{ fpm_service }} is not running."
      vars:
        fpm_service: "php{{ verify_php_version.stdout | trim }}-fpm.service"
      when: verify_webserver_type == 'nginx'

    - name: Assert the PHP-FPM socket exists
      ansible.builtin.stat:
        path: "/run/php/php{{ verify_php_version.stdout | trim }}-fpm.sock"
      register: verify_socket
      failed_when: not verify_socket.stat.exists
      when: verify_webserver_type == 'nginx'

    - name: Request the site front page
      ansible.builtin.uri:
        url: "{{ verify_site_url }}/"
        status_code: 200
        return_content: true
        validate_certs: "{{ verify_validate_certs }}"
      register: verify_frontpage

    - name: Assert the response is a rendered Drupal page and not a PHP error
      ansible.builtin.assert:
        that:
          - "'Drupal' in verify_frontpage.content"
          - "'Fatal error' not in verify_frontpage.content"
          - "'The website encountered an unexpected error' not in verify_frontpage.content"
        fail_msg: "Front page returned 200 but does not look like a working Drupal render."

    - name: Assert Drupal bootstraps successfully
      ansible.builtin.command:
        cmd: "{{ verify_drush }} status --field=bootstrap"
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_bootstrap
      changed_when: false
      failed_when: "'Successful' not in verify_bootstrap.stdout"

    # severity=1 catches warnings as well as errors, so this asserts the goal of
    # a genuinely clean status page rather than merely an error-free one.
    - name: Read the Drupal status report
      ansible.builtin.command:
        cmd: "{{ verify_drush }} core:requirements --format=json --severity=1"
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_requirements
      changed_when: false
      failed_when: false

    - name: Collect the outstanding status report items
      ansible.builtin.set_fact:
        verify_status_items: >-
          {{ (verify_requirements.stdout | from_json).values() | map(attribute='title') | list
             if (verify_requirements.stdout | trim | length) > 2 else [] }}

    - name: Report the Drupal status page state
      ansible.builtin.debug:
        msg: >-
          {{ 'Drupal status report is completely clean.' if verify_status_items | length == 0
             else 'Outstanding status report items: ' ~ (verify_status_items | join(', ')) }}

    # The allowlist is deliberately explicit rather than a blanket skip, so a
    # newly appearing warning fails the run instead of hiding behind a known one.
    - name: Assert no unexpected status report warnings or errors
      ansible.builtin.assert:
        that:
          - verify_status_items | difference(verify_status_allowed) | length == 0
        fail_msg: >-
          Unexpected Drupal status report items:
          {{ verify_status_items | difference(verify_status_allowed) | join(', ') }}
        success_msg: >-
          {{ 'Status report clean.' if verify_status_items | length == 0
             else 'Only known-unfixable items remain: ' ~ (verify_status_items | join(', ')) }}

    - name: Assert the hash salt is present and non-empty
      ansible.builtin.command:
        cmd: "{{ verify_drush }} php:eval \"print strlen(\\Drupal\\Core\\Site\\Settings::get('hash_salt'));\""
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_salt
      changed_when: false
      failed_when: (verify_salt.stdout | trim | int) < 32

    - name: Assert the files directory is writable by the web server
      ansible.builtin.stat:
        path: "{{ verify_base_path }}/web/sites/default/files"
      register: verify_files_dir
      failed_when: >-
        not verify_files_dir.stat.exists
        or verify_files_dir.stat.pw_name != verify_webserver_user

    - name: Assert settings.php is not writable by the web server
      ansible.builtin.stat:
        path: "{{ verify_base_path }}/web/sites/default/settings.php"
      register: verify_settings
      failed_when: >-
        not verify_settings.stat.exists
        or verify_settings.stat.wgrp
        or verify_settings.stat.woth

    - name: Assert the config sync directory is where Drupal expects it
      ansible.builtin.command:
        cmd: "{{ verify_drush }} php:eval \"print \\Drupal\\Core\\Site\\Settings::get('config_sync_directory');\""
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_config_sync
      changed_when: false

    - name: Assert the config sync directory actually exists on disk
      ansible.builtin.stat:
        path: "{{ verify_base_path }}/web/{{ verify_config_sync.stdout | trim }}"
      register: verify_config_sync_dir
      failed_when: not verify_config_sync_dir.stat.exists


    #
    # Cron
    #

    # Calling systemd_service with neither state nor enabled only reads status.
    - name: Read the Drupal cron timer state
      ansible.builtin.systemd_service:
        name: drupal-cron.timer
      register: verify_cron_timer
      changed_when: false
      when: verify_cron_enabled

    - name: Assert the cron timer is active and has a next scheduled run
      ansible.builtin.assert:
        that:
          - verify_cron_timer.status.ActiveState == 'active'
          - verify_cron_timer.status.UnitFileState == 'enabled'
          - verify_cron_timer.status.NextElapseUSecRealtime | default('') | length > 0
        fail_msg: >-
          drupal-cron.timer is not scheduled:
          state={{ verify_cron_timer.status.ActiveState | default('?') }}
          next={{ verify_cron_timer.status.NextElapseUSecRealtime | default('none') }}
      when: verify_cron_enabled

    - name: Read the Drupal cron service state
      ansible.builtin.systemd_service:
        name: drupal-cron.service
      register: verify_cron_service
      changed_when: false
      when: verify_cron_enabled

    # A timer that fires but whose service fails every time still looks
    # "active", so check what actually happened on the last run.
    - name: Assert the last cron run succeeded
      ansible.builtin.assert:
        that:
          - verify_cron_service.status.Result in ['success', '']
        fail_msg: "Last drupal-cron.service run result was {{ verify_cron_service.status.Result | default('?') }}."
      when: verify_cron_enabled

    - name: Assert Drupal recorded a recent cron run
      ansible.builtin.command:
        cmd: "{{ verify_drush }} state:get system.cron_last"
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_cron_last
      changed_when: false
      failed_when: >-
        (verify_cron_last.stdout | trim | length) == 0
        or ((ansible_date_time.epoch | int) - (verify_cron_last.stdout | trim | int)) > 86400
      when: verify_cron_enabled

    # Cron writing as root would leave files the web server cannot rewrite,
    # which is why the unit runs as the web server account.
    - name: Assert cron did not leave root-owned files in the files directory
      ansible.builtin.command:
        cmd: find {{ verify_base_path }}/web/sites/default/files -user root -print -quit
      register: verify_cron_root_files
      changed_when: false
      failed_when: (verify_cron_root_files.stdout | trim) | length > 0
      when: verify_cron_enabled

    - name: Assert Drupal's request-triggered automated cron is disabled
      ansible.builtin.command:
        cmd: "{{ verify_drush }} config:get automated_cron.settings interval --format=string"
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_automated_cron
      changed_when: false
      failed_when: (verify_automated_cron.stdout | trim) not in ['0', '']
      when: verify_cron_enabled


    #
    # Backups
    #

    - name: Read the Drupal backup timer state
      ansible.builtin.systemd_service:
        name: drupal-backup.timer
      register: verify_backup_timer
      changed_when: false
      when: verify_backup_enabled

    - name: Assert the backup timer is active and scheduled
      ansible.builtin.assert:
        that:
          - verify_backup_timer.status.ActiveState == 'active'
          - verify_backup_timer.status.UnitFileState == 'enabled'
          - verify_backup_timer.status.NextElapseUSecRealtime | default('') | length > 0
        fail_msg: >-
          drupal-backup.timer is not scheduled:
          state={{ verify_backup_timer.status.ActiveState | default('?') }}
      when: verify_backup_enabled

    - name: Read the Drupal backup service state
      ansible.builtin.systemd_service:
        name: drupal-backup.service
      register: verify_backup_service
      changed_when: false
      when: verify_backup_enabled

    - name: Assert the last backup run succeeded
      ansible.builtin.assert:
        that:
          - verify_backup_service.status.Result in ['success', '']
        fail_msg: "Last drupal-backup.service run result was {{ verify_backup_service.status.Result | default('?') }}."
      when: verify_backup_enabled

    # The dumps contain every user record, and the settings archive contains the
    # database password, so the web server must not be able to read them.
    - name: Assert the backup directory is root-only
      ansible.builtin.stat:
        path: "{{ verify_backup_path }}"
      register: verify_backup_dir
      failed_when: >-
        not verify_backup_dir.stat.exists
        or verify_backup_dir.stat.pw_name != 'root'
        or verify_backup_dir.stat.rgrp or verify_backup_dir.stat.roth
      when: verify_backup_enabled

    - name: List the backup artefacts
      ansible.builtin.find:
        paths: "{{ verify_backup_path }}"
        patterns: "drupal-*.sql.gz"
      register: verify_backup_files
      when: verify_backup_enabled

    - name: Assert at least one database dump exists and is non-trivial
      ansible.builtin.assert:
        that:
          - verify_backup_files.files | length > 0
          - (verify_backup_files.files | map(attribute='size') | max) > 1024
        fail_msg: "No usable database dump found in {{ verify_backup_path }}."
      when: verify_backup_enabled

    # A dump that cannot be decompressed is not a backup. Checking integrity is
    # the cheapest available proxy for "this would actually restore".
    - name: Assert the most recent dump passes a gzip integrity check
      ansible.builtin.command:
        cmd: gzip -t {{ (verify_backup_files.files | sort(attribute='mtime') | last).path | quote }}
      changed_when: false
      when:
        - verify_backup_enabled
        - verify_backup_files.files | length > 0

    - name: Assert the most recent dump contains real Drupal data
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          zcat {{ (verify_backup_files.files | sort(attribute='mtime') | last).path | quote }}
          | grep -c 'CREATE TABLE `users_field_data`'
        executable: /bin/bash
      register: verify_backup_content
      changed_when: false
      failed_when: (verify_backup_content.stdout | trim | int) < 1
      when:
        - verify_backup_enabled
        - verify_backup_files.files | length > 0

    - name: Assert the restore script is installed and executable
      ansible.builtin.stat:
        path: /usr/local/sbin/drupal-restore.sh
      register: verify_restore_script
      failed_when: not verify_restore_script.stat.exists or not verify_restore_script.stat.xusr
      when: verify_backup_enabled


    #
    # PHP tuning
    #

    # `php-fpm -i` reports the FPM SAPI's own configuration. Reading these
    # through drush or `php` would report the CLI SAPI instead, which loads a
    # different conf.d and forces max_execution_time to 0 -- so a CLI-based
    # check would pass even if the FPM drop-in were missing entirely.
    - name: Read the effective PHP-FPM settings
      ansible.builtin.command:
        cmd: "php-fpm{{ verify_php_version.stdout | trim }} -i"
      register: verify_php_ini
      changed_when: false
      when: verify_webserver_type == 'nginx'

    # php -i prints "key => local_value => master_value". Lines that do not
    # match that shape (section headers, multi-line values) yield None from
    # regex_search and are dropped rather than corrupting the dict.
    - name: Parse the effective PHP-FPM settings
      ansible.builtin.set_fact:
        verify_php: >-
          {{ dict(verify_php_ini.stdout_lines
                  | map('regex_search', '^([a-z_][a-z0-9_.]*) => (.*?) => (.*)$', '\1', '\2')
                  | select('ne', None)
                  | list) }}
      when: verify_webserver_type == 'nginx'

    - name: Assert the PHP tuning is in effect for the FPM SAPI
      ansible.builtin.assert:
        that:
          - verify_php['memory_limit'] == verify_memory_limit
          - verify_php['max_input_vars'] | int >= 2000
          - verify_php['max_execution_time'] | int > 0
          - verify_php['opcache.enable'] == 'On'
          - verify_php['expose_php'] == 'Off'
        fail_msg: >-
          PHP-FPM drop-in settings are not in effect:
          memory_limit={{ verify_php['memory_limit'] | default('?') }}
          max_execution_time={{ verify_php['max_execution_time'] | default('?') }}
          opcache={{ verify_php['opcache.enable'] | default('?') }}
      when: verify_webserver_type == 'nginx'

    - name: Assert APCu is available to the FPM SAPI
      ansible.builtin.assert:
        that:
          - "'apcu' in verify_php_ini.stdout"
        fail_msg: "APCu is not loaded in PHP-FPM; Drupal's status report will flag the cache backend."
      when: verify_webserver_type == 'nginx'

    - name: Assert GD reports AVIF when the custom build is enabled
      ansible.builtin.assert:
        that:
          - verify_php['gd.avif_support'] | default(verify_php_ini.stdout is search('AVIF Support => enabled'))
        fail_msg: "php_gd_avif_build is enabled but PHP-FPM does not report AVIF support."
      when: verify_gd_avif | bool

    # gd_info() has been observed reporting AVIF as enabled on Ubuntu while
    # imageavif() failed at runtime, so encode a real image rather than trust it.
    # Cleans up after itself so this playbook stays read-only.
    - name: Assert GD can actually encode an AVIF image
      ansible.builtin.command:
        cmd: >-
          php -r '$f = tempnam(sys_get_temp_dir(), "avif");
          $im = imagecreatetruecolor(16, 16);
          $ok = imageavif($im, $f, 30);
          $valid = $ok && filesize($f) > 0;
          unlink($f);
          if (!$valid) { exit(1); }
          echo "ok";'
      register: verify_avif_encode
      changed_when: false
      failed_when: verify_avif_encode.stdout is not search('ok')
      when: verify_gd_avif | bool

    # The whole point of the private prefix is that apt keeps managing the
    # system libgd3. If this ever fails, the build clobbered a distro package.
    - name: Assert the system libgd3 is still the unmodified distribution package
      ansible.builtin.command:
        cmd: dpkg -V libgd3
      register: verify_libgd_intact
      changed_when: false
      failed_when: verify_libgd_intact.rc != 0
      when: verify_gd_avif | bool

    - name: Assert the PHP and web server upload limits agree
      ansible.builtin.assert:
        that:
          - verify_php['upload_max_filesize'] | upper == verify_max_body_size | upper
        fail_msg: >-
          upload_max_filesize ({{ verify_php['upload_max_filesize'] }}) does not
          match the web server body limit ({{ verify_max_body_size }}), which
          produces confusing 413s at the boundary.
      when: verify_webserver_type == 'nginx'


    #
    # TLS -- only checked when webserver_tls_enabled is true
    #

    - name: Assert HTTP redirects to HTTPS
      ansible.builtin.uri:
        url: "http://{{ verify_sitename }}/"
        follow_redirects: none
        status_code: 301
      register: verify_redirect
      failed_when: >-
        verify_redirect.location is not defined
        or not verify_redirect.location.startswith('https://')
      when: verify_tls_enabled

    - name: Assert the ACME challenge path is still reachable over HTTP
      ansible.builtin.uri:
        url: "http://{{ verify_sitename }}/.well-known/acme-challenge/verify-probe"
        status_code: [404, 403]
        follow_redirects: none
      when: verify_tls_enabled

    - name: Assert HSTS is set and Drupal knows the request was over TLS
      ansible.builtin.assert:
        that:
          - verify_frontpage.strict_transport_security is defined
          - "'http://' ~ verify_sitename not in verify_frontpage.content"
        fail_msg: >-
          HTTPS responded but either HSTS is missing or Drupal is still
          generating http:// URLs (check fastcgi_param HTTPS on).
      when: verify_tls_enabled

    - name: Assert the negotiated protocol is TLS 1.2 or better
      ansible.builtin.command:
        cmd: >-
          openssl s_client -connect 127.0.0.1:443
          -servername {{ verify_sitename }} -tls1_2 -brief
      register: verify_tls_proto
      changed_when: false
      failed_when: verify_tls_proto.rc != 0
      when: verify_tls_enabled

    - name: Assert TLS 1.0 and 1.1 are refused
      ansible.builtin.command:
        cmd: >-
          openssl s_client -connect 127.0.0.1:443
          -servername {{ verify_sitename }} -tls1_1 -brief
      register: verify_tls_old
      changed_when: false
      failed_when: verify_tls_old.rc == 0
      when: verify_tls_enabled

    # service_facts only enumerates .service units, so the timer has to be
    # queried directly. Calling systemd_service with neither state nor enabled
    # only reads status; it does not change anything.
    - name: Assert the certbot renewal timer is active
      ansible.builtin.systemd_service:
        name: certbot.timer
      register: verify_certbot_timer
      changed_when: false
      failed_when: verify_certbot_timer.status.ActiveState != 'active'
      when: verify_tls_enabled

    - name: Assert the renewal deploy hook is installed and executable
      ansible.builtin.stat:
        path: /etc/letsencrypt/renewal-hooks/deploy/reload-webserver.sh
      register: verify_deploy_hook
      failed_when: >-
        not verify_deploy_hook.stat.exists
        or not verify_deploy_hook.stat.xusr
      when: verify_tls_enabled

    # Opt in with -e verify_check_renewal=true. This performs a real ACME
    # transaction against Let's Encrypt: it takes a couple of minutes, counts
    # against rate limits, and fails intermittently on transient authorization
    # state that says nothing about this host's configuration. The renewal
    # timer, deploy hook and certificate expiry are all checked above without
    # touching the network, so routine verification does not need it.
    - name: Assert a certbot dry-run renewal succeeds
      ansible.builtin.command:
        cmd: certbot renew --dry-run --cert-name {{ verify_sitename }}
      register: verify_renew
      changed_when: false
      when:
        - verify_tls_enabled
        - verify_check_renewal

    - name: Check the certificate is not close to expiry
      ansible.builtin.command:
        cmd: "openssl x509 -in /etc/letsencrypt/live/{{ verify_sitename }}/fullchain.pem -noout -checkend 1209600"
      register: verify_cert_expiry
      changed_when: false
      failed_when: verify_cert_expiry.rc != 0
      when: verify_tls_enabled

    - name: Assert the Cloudflare credentials file is not world or group readable
      ansible.builtin.stat:
        path: /etc/letsencrypt/cloudflare.ini
      register: verify_cf_creds
      failed_when: verify_cf_creds.stat.exists and (verify_cf_creds.stat.rgrp or verify_cf_creds.stat.roth)
      when: verify_tls_enabled
