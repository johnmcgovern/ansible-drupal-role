---
# Post-deploy smoke test. Read-only: asserts the deployed stack is actually
# serving Drupal rather than merely having had the tasks reported as changed.
#
#   ansible-playbook -i hosts tests/verify.yml

- name: Verify the deployed Drupal stack
  hosts: webservers
  become: true
  gather_facts: true

  # These are deliberately NOT named after the role variables. Play vars take
  # precedence over group_vars, so reusing the real names here would shadow the
  # deployed configuration and, for example, silently skip every TLS check on a
  # TLS-enabled host.
  vars:
    verify_base_path: "{{ drupal_base_path | default('/var/www/drupal') }}"
    verify_drush: "{{ verify_base_path }}/vendor/bin/drush"
    # Same OS-derived fallback the roles use: Debian's nginx runs as www-data,
    # Red Hat's as nginx. Hardcoding either would make the ownership assertions
    # below pass vacuously on the other platform.
    verify_webserver_user: >-
      {{ webserver_user
         | default('nginx' if ansible_os_family == 'RedHat' else 'www-data') }}
    verify_sitename: "{{ webserver_sitename | default('127.0.0.1') }}"
    verify_max_body_size: "{{ webserver_max_body_size | default('64M') }}"
    verify_memory_limit: "{{ php_memory_limit | default('256M') }}"
    verify_tls_enabled: "{{ webserver_tls_enabled | default(false) | bool }}"
    # Status report items this deployment cannot control.
    #
    # "GD library" is a warning purely because GD lacks AVIF: Ubuntu builds
    # libgd2 without libavif on both 24.04 and 26.04 (LP#2031934), and RHEL 9
    # ships no libavif at all. Enabling php_gd_avif_build resolves it on Ubuntu,
    # so the entry drops out of the allowlist and a GD warning becomes a failure
    # again; on RHEL the flag is rejected outright, so the warning is permanent.
    #
    # The two update-status items depend on Drupal's fetch queue rather than on
    # anything installed here. Observed on a converged host: the release data is
    # present and complete (six projects, hundreds of releases) and cron is
    # running successfully, yet update_calculate_project_data() reports every
    # project as FETCH_PENDING, which renders as "There was a problem checking
    # available updates". It resolves immediately after a deploy, because the
    # role refreshes update data and then runs cron to drain the queue, and
    # returns later. Asserting on it would make this test fail as a function of
    # elapsed time and drupal.org reachability, so it is reported but not fatal.
    #
    # IMPORTANT: this allowlist applies to WARNINGS ONLY. Error-severity items
    # are never tolerated, whatever their title -- see the two assertions below.
    # That distinction is what keeps these two entries from hiding a real
    # problem, because Drupal reports both the harmless and the serious states
    # under the same title. From
    # core/modules/update/src/Hook/UpdateRequirements.php:
    #
    #   Error    "Not secure!"          the installed release has a known
    #                                   security vulnerability
    #   Error    "Revoked!"             the release was withdrawn
    #   Error    "Unsupported release"  the branch no longer gets security fixes
    #   Warning  "Out of date"          a newer release exists; not a security
    #                                   matter, and failing on it would make
    #                                   this test fail as a function of the
    #                                   upstream release calendar
    #   Warning  fetch-problem states   UNKNOWN / NOT_CHECKED / NOT_FETCHED /
    #                                   FETCH_PENDING -- the flaky case above
    #
    # The same rule covers coverage_core, which Drupal raises to Error once the
    # installed minor's security coverage has actually ended.
    verify_status_allowed: >-
      {{ ['Drupal core update status', 'Module and theme update status']
         + ([] if (php_gd_avif_build | default(false) | bool) else ['GD library']) }}
    verify_tls_staging: "{{ webserver_tls_staging | default(false) | bool }}"
    verify_gd_avif: "{{ php_gd_avif_build | default(false) | bool }}"
    verify_cron_enabled: "{{ drupal_cron_enabled | default(true) | bool }}"
    verify_backup_enabled: "{{ drupal_backup_enabled | default(true) | bool }}"
    verify_backup_path: "{{ drupal_backup_path | default('/var/backups/drupal') }}"
    verify_password_algorithm: "{{ drupal_password_algorithm | default('argon2id') }}"
    # Live ACME dry-run renewal: slow, rate limited and intermittently flaky.
    # Enable with -e verify_check_renewal=true when you want it.
    verify_check_renewal: false
    # A staging certificate is signed by an untrusted CA by design, so chain
    # validation has to be off for those runs. Everything else is still checked.
    verify_validate_certs: "{{ not (webserver_tls_staging | default(false) | bool) }}"
    verify_site_url: >-
      {{ 'https://' ~ (webserver_sitename | default('127.0.0.1'))
         if (webserver_tls_enabled | default(false) | bool)
         else 'http://127.0.0.1' }}

  tasks:

    # Every TLS and AVIF assertion in this playbook is conditional on a
    # variable that comes from group_vars. If group_vars is not loaded -- which
    # happens silently whenever this playbook is run with an inventory that
    # does not sit beside it, because Ansible looks for group_vars next to the
    # inventory and next to the playbook and this one lives in tests/ -- those
    # variables fall back to false and every one of those assertions is skipped.
    # The run then passes having checked none of the things it exists to check.
    #
    # So: ask the host what it is actually doing, and refuse to continue if that
    # contradicts the configuration this playbook thinks it is verifying. This
    # is the same failure the play vars below are prefixed to avoid, arriving by
    # a different route.
    - name: Look for a TLS listener regardless of what the variables say
      ansible.builtin.command:
        cmd: ss -H -lnt sport = :443
      register: verify_tls_listener
      changed_when: false
      failed_when: false

    - name: Assert the TLS configuration matches what the host is really serving
      ansible.builtin.assert:
        that:
          - (verify_tls_listener.stdout | trim | length > 0) == verify_tls_enabled
        fail_msg: >-
          {{ 'This host is listening on port 443 but webserver_tls_enabled is
              false, so every TLS assertion below would be skipped and this run
              would pass without checking any of them. The usual cause is
              group_vars not being loaded: Ansible looks for it beside the
              inventory and beside the playbook, and this playbook lives in
              tests/. Run it as `ansible-playbook -i hosts tests/verify.yml`
              from the repository root, or pass the variables with -e.'
             if (verify_tls_listener.stdout | trim | length > 0)
             else 'webserver_tls_enabled is true but nothing is listening on
              port 443.' }}

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Assert the web server is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services[webserver_service].state == 'running'
        fail_msg: "nginx is not running."
      vars:
        webserver_service: nginx.service

    - name: Assert MariaDB is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['mariadb.service'].state == 'running'
        fail_msg: "mariadb is not running."

    - name: Read the database server version
      ansible.builtin.command:
        cmd: mariadb --skip-column-names --batch --execute "SELECT VERSION();"
      register: verify_db_version
      changed_when: false

    - name: Assert the database server is MariaDB
      ansible.builtin.assert:
        that:
          - "'MariaDB' in verify_db_version.stdout"
        fail_msg: >-
          Expected MariaDB, got "{{ verify_db_version.stdout | trim }}".
        success_msg: "Database server is {{ verify_db_version.stdout | trim }}."

    # Guards against a MySQL or Percona package arriving as a dependency of
    # something else. Each platform has exactly one false positive to exclude,
    # and they are not the same package:
    #
    #   Debian  mysql-common is a hard dependency of mariadb-common and only
    #           provides the shared /etc/mysql/my.cnf shim.
    #   RedHat  mysql-selinux is the SELinux policy module for the MariaDB
    #           server, pulled in by mariadb-server itself. Note that
    #           mysql-common is NOT excluded here: on Red Hat it belongs to the
    #           Oracle mysql:8.0 module stream, so its presence is exactly the
    #           thing worth failing on.
    - name: List installed packages from other MySQL variants
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          dpkg-query -W -f='${Package} ${Status}\n' 2>/dev/null
          | awk '$NF == "installed" { print $1 }'
          | grep -E '^(mysql-server|mysql-client|mysql-community|percona-)|^libmysqlclient'
          | grep -vx 'mysql-common' || true
        executable: /bin/bash
      register: verify_mysql_variants_deb
      changed_when: false
      when: ansible_os_family == 'Debian'

    - name: List installed packages from other MySQL variants
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          rpm -qa --qf '%{NAME}\n' 2>/dev/null
          | grep -E '^(mysql|community-mysql|percona-)'
          | grep -vx 'mysql-selinux' || true
        executable: /bin/bash
      register: verify_mysql_variants_rpm
      changed_when: false
      when: ansible_os_family == 'RedHat'

    - name: Register the MySQL variant packages found
      ansible.builtin.set_fact:
        verify_mysql_variants: >-
          {{ verify_mysql_variants_rpm if ansible_os_family == 'RedHat'
             else verify_mysql_variants_deb }}

    - name: Assert no MySQL or Percona packages are installed
      ansible.builtin.assert:
        that:
          - (verify_mysql_variants.stdout | trim) == ''
        fail_msg: >-
          Packages from another MySQL variant are installed:
          {{ verify_mysql_variants.stdout_lines | join(', ') }}.
          This stack is MariaDB only.

    - name: Detect the PHP-FPM service
      ansible.builtin.command:
        cmd: php -r "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;"
      register: verify_php_version
      changed_when: false

    # Derived exactly as roles/web derives them, and deliberately not read back
    # from the role: this playbook is meant to check the deployment against the
    # platform's real layout, so importing the role's own idea of where things
    # are would make the assertions agree with themselves. Debian versions the
    # service, binary and socket per interpreter; Red Hat installs one PHP and
    # names all three without a version.
    - name: Derive the platform's PHP-FPM service, socket and binary
      ansible.builtin.set_fact:
        verify_fpm_service: >-
          {{ 'php-fpm.service' if ansible_os_family == 'RedHat'
             else 'php' ~ (verify_php_version.stdout | trim) ~ '-fpm.service' }}
        verify_fpm_socket: >-
          {{ '/run/php-fpm/www.sock' if ansible_os_family == 'RedHat'
             else '/run/php/php' ~ (verify_php_version.stdout | trim) ~ '-fpm.sock' }}
        verify_fpm_binary: >-
          {{ 'php-fpm' if ansible_os_family == 'RedHat'
             else 'php-fpm' ~ (verify_php_version.stdout | trim) }}

    - name: Assert PHP-FPM is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services[verify_fpm_service].state == 'running'
        fail_msg: "{{ verify_fpm_service }} is not running."

    - name: Assert the PHP-FPM socket exists
      ansible.builtin.stat:
        path: "{{ verify_fpm_socket }}"
      register: verify_socket
      failed_when: not verify_socket.stat.exists

    # The vhost points fastcgi_pass at this socket, and nginx runs as the web
    # server account. On Red Hat the packaged pool listens on a socket owned by
    # `apache` and reachable only through a POSIX ACL, so a pool left at its
    # packaged identity produces a 502 on every request -- which this catches
    # directly rather than inferring it from the front page happening to load.
    - name: Assert the web server can reach the PHP-FPM socket
      ansible.builtin.command:
        cmd: "test -r {{ verify_fpm_socket }} -a -w {{ verify_fpm_socket }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      changed_when: false

    - name: Request the site front page
      ansible.builtin.uri:
        url: "{{ verify_site_url }}/"
        status_code: 200
        return_content: true
        validate_certs: "{{ verify_validate_certs }}"
      register: verify_frontpage

    - name: Assert the response is a rendered Drupal page and not a PHP error
      ansible.builtin.assert:
        that:
          - "'Drupal' in verify_frontpage.content"
          - "'Fatal error' not in verify_frontpage.content"
          - "'The website encountered an unexpected error' not in verify_frontpage.content"
        fail_msg: "Front page returned 200 but does not look like a working Drupal render."

    - name: Assert Drupal bootstraps successfully
      ansible.builtin.command:
        cmd: "{{ verify_drush }} status --field=bootstrap"
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_bootstrap
      changed_when: false
      failed_when: "'Successful' not in verify_bootstrap.stdout"

    # severity=1 catches warnings as well as errors, so this asserts the goal of
    # a genuinely clean status page rather than merely an error-free one.
    - name: Read the Drupal status report
      ansible.builtin.command:
        cmd: "{{ verify_drush }} core:requirements --format=json --severity=1"
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_requirements
      changed_when: false
      failed_when: false

    # Drush emits an empty JSON array rather than an object when nothing is
    # outstanding, and .values() on a list is an error, hence the length guard.
    # `sid` is the numeric severity: 2 is Error, 1 is Warning.
    - name: Collect the outstanding status report items
      ansible.builtin.set_fact:
        verify_status_raw: >-
          {{ (verify_requirements.stdout | from_json).values() | list
             if (verify_requirements.stdout | trim | length) > 2 else [] }}

    - name: Separate the errors from the warnings
      ansible.builtin.set_fact:
        verify_status_items: "{{ verify_status_raw | map(attribute='title') | list }}"
        verify_status_errors: >-
          {{ verify_status_raw | selectattr('sid', 'defined')
                               | selectattr('sid', 'ge', 2) | list }}

    # Titles rather than whole records, because that is all the allowlist deals
    # in. One record per title, so subtracting the error titles is exact.
    - name: Reduce the warnings to their titles
      ansible.builtin.set_fact:
        verify_status_warning_titles: >-
          {{ verify_status_items
             | difference(verify_status_errors | map(attribute='title') | list) }}

    - name: Report the Drupal status page state
      ansible.builtin.debug:
        msg: >-
          {{ 'Drupal status report is completely clean.' if verify_status_items | length == 0
             else 'Outstanding status report items: ' ~ (verify_status_items | join(', ')) }}

    # No allowlist here on purpose. An error-severity item means the site is
    # actually broken or actually insecure -- "Not secure!", "Revoked!",
    # "Unsupported release", or security coverage that has ended -- and Drupal
    # files all of those under the same two titles the allowlist tolerates as
    # warnings. Checking the title alone, as this once did, meant a site running
    # a release with a known vulnerability passed the smoke test.
    - name: Assert nothing on the status report is an error
      ansible.builtin.assert:
        that:
          - verify_status_errors | length == 0
        fail_msg: >-
          Error-severity items on the Drupal status report:
          {{ verify_status_errors | map(attribute='title') | join(', ') }}
          -- reported as:
          {{ verify_status_errors | map(attribute='value')
             | map('striptags') | map('trim') | join('; ') }}.
          These are never allowlisted: they mean the site is insecure or broken,
          not merely behind.

    # The allowlist is deliberately explicit rather than a blanket skip, so a
    # newly appearing warning fails the run instead of hiding behind a known one.
    - name: Assert no unexpected status report warnings
      ansible.builtin.assert:
        that:
          - verify_status_warning_titles | difference(verify_status_allowed) | length == 0
        fail_msg: >-
          Unexpected Drupal status report items:
          {{ verify_status_warning_titles | difference(verify_status_allowed) | join(', ') }}
        success_msg: >-
          {{ 'Status report clean.' if verify_status_items | length == 0
             else 'Only known-unfixable warnings remain: ' ~ (verify_status_items | join(', ')) }}

    - name: Assert the hash salt is present and non-empty
      ansible.builtin.command:
        cmd: "{{ verify_drush }} php:eval \"print strlen(\\Drupal\\Core\\Site\\Settings::get('hash_salt'));\""
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_salt
      changed_when: false
      failed_when: (verify_salt.stdout | trim | int) < 32

    - name: Assert the files directory is writable by the web server
      ansible.builtin.stat:
        path: "{{ verify_base_path }}/web/sites/default/files"
      register: verify_files_dir
      failed_when: >-
        not verify_files_dir.stat.exists
        or verify_files_dir.stat.pw_name != verify_webserver_user

    - name: Assert settings.php is not writable by the web server
      ansible.builtin.stat:
        path: "{{ verify_base_path }}/web/sites/default/settings.php"
      register: verify_settings
      failed_when: >-
        not verify_settings.stat.exists
        or verify_settings.stat.wgrp
        or verify_settings.stat.woth

    - name: Assert the config sync directory is where Drupal expects it
      ansible.builtin.command:
        cmd: "{{ verify_drush }} php:eval \"print \\Drupal\\Core\\Site\\Settings::get('config_sync_directory');\""
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_config_sync
      changed_when: false

    - name: Assert the config sync directory actually exists on disk
      ansible.builtin.stat:
        path: "{{ verify_base_path }}/web/{{ verify_config_sync.stdout | trim }}"
      register: verify_config_sync_dir
      failed_when: not verify_config_sync_dir.stat.exists


    #
    # Password hashing
    #

    # Reads the algorithm the container actually built with, hashes a sample to
    # confirm the prefix, and checks a bcrypt hash still validates. Drupal
    # silently falls back to the PHP default when password.algorithm is not a
    # value from password_algos(), so asserting on configuration alone would
    # pass while the site kept using bcrypt.
    - name: Inspect the password hashing service
      ansible.builtin.command:
        cmd: >-
          {{ verify_drush }} php:eval
          "$p = \Drupal::service('password');
           $r = new ReflectionClass($p);
           $a = $r->getProperty('algorithm'); $a->setAccessible(TRUE);
           $legacy = password_hash('probe', PASSWORD_BCRYPT);
           print json_encode([
             'algorithm' => $a->getValue($p),
             'sample' => substr($p->hash('probe'), 0, 10),
             'bcrypt_still_valid' => $p->check('probe', $legacy),
             'bcrypt_needs_rehash' => $p->needsRehash($legacy),
           ]);"
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_password
      changed_when: false

    - name: Assert the configured hashing algorithm is actually in use
      ansible.builtin.assert:
        that:
          - (verify_password.stdout | from_json).algorithm == verify_password_algorithm
          - (verify_password.stdout | from_json).sample.startswith('$' ~ verify_password_algorithm ~ '$')
        fail_msg: >-
          Expected {{ verify_password_algorithm }} but the password service reports
          algorithm={{ (verify_password.stdout | from_json).algorithm | default('null') }}
          producing hashes like {{ (verify_password.stdout | from_json).sample | default('?') }}.
          An unrecognised password.algorithm silently degrades to the PHP default.
      when: verify_password_algorithm | length > 0

    # Switching algorithms must not lock out existing users. password_verify()
    # reads the algorithm from the hash, so old bcrypt hashes keep working and
    # Drupal rehashes them on the user's next successful login.
    - name: Assert existing bcrypt hashes still validate and are marked for rehash
      ansible.builtin.assert:
        that:
          - (verify_password.stdout | from_json).bcrypt_still_valid
          - (verify_password.stdout | from_json).bcrypt_needs_rehash
        fail_msg: >-
          Pre-existing bcrypt hashes do not behave correctly under the new
          algorithm: valid={{ (verify_password.stdout | from_json).bcrypt_still_valid }}
          needs_rehash={{ (verify_password.stdout | from_json).bcrypt_needs_rehash }}
      when: verify_password_algorithm | length > 0

    - name: Assert services.yml is loaded by the container
      ansible.builtin.command:
        cmd: >-
          {{ verify_drush }} php:eval
          "print implode(',', \Drupal\Core\Site\Settings::get('container_yamls', []));"
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_container_yamls
      changed_when: false
      failed_when: "'sites/default/services.yml' not in verify_container_yamls.stdout"


    #
    # Cron
    #

    # Calling systemd_service with neither state nor enabled only reads status.
    - name: Read the Drupal cron timer state
      ansible.builtin.systemd_service:
        name: drupal-cron.timer
      register: verify_cron_timer
      changed_when: false
      when: verify_cron_enabled

    - name: Assert the cron timer is active and has a next scheduled run
      ansible.builtin.assert:
        that:
          - verify_cron_timer.status.ActiveState == 'active'
          - verify_cron_timer.status.UnitFileState == 'enabled'
          - verify_cron_timer.status.NextElapseUSecRealtime | default('') | length > 0
        fail_msg: >-
          drupal-cron.timer is not scheduled:
          state={{ verify_cron_timer.status.ActiveState | default('?') }}
          next={{ verify_cron_timer.status.NextElapseUSecRealtime | default('none') }}
      when: verify_cron_enabled

    - name: Read the Drupal cron service state
      ansible.builtin.systemd_service:
        name: drupal-cron.service
      register: verify_cron_service
      changed_when: false
      when: verify_cron_enabled

    # A timer that fires but whose service fails every time still looks
    # "active", so check what actually happened on the last run.
    - name: Assert the last cron run succeeded
      ansible.builtin.assert:
        that:
          - verify_cron_service.status.Result in ['success', '']
        fail_msg: "Last drupal-cron.service run result was {{ verify_cron_service.status.Result | default('?') }}."
      when: verify_cron_enabled

    - name: Assert Drupal recorded a recent cron run
      ansible.builtin.command:
        cmd: "{{ verify_drush }} state:get system.cron_last"
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_cron_last
      changed_when: false
      failed_when: >-
        (verify_cron_last.stdout | trim | length) == 0
        or ((ansible_date_time.epoch | int) - (verify_cron_last.stdout | trim | int)) > 86400
      when: verify_cron_enabled

    # Cron writing as root would leave files the web server cannot rewrite,
    # which is why the unit runs as the web server account.
    - name: Assert cron did not leave root-owned files in the files directory
      ansible.builtin.command:
        cmd: find {{ verify_base_path }}/web/sites/default/files -user root -print -quit
      register: verify_cron_root_files
      changed_when: false
      failed_when: (verify_cron_root_files.stdout | trim) | length > 0
      when: verify_cron_enabled

    - name: Assert Drupal's request-triggered automated cron is disabled
      ansible.builtin.command:
        cmd: "{{ verify_drush }} config:get automated_cron.settings interval --format=string"
        chdir: "{{ verify_base_path }}"
      become: true
      become_user: "{{ verify_webserver_user }}"
      environment:
        HOME: /tmp
      register: verify_automated_cron
      changed_when: false
      failed_when: (verify_automated_cron.stdout | trim) not in ['0', '']
      when: verify_cron_enabled


    #
    # Backups
    #

    - name: Read the Drupal backup timer state
      ansible.builtin.systemd_service:
        name: drupal-backup.timer
      register: verify_backup_timer
      changed_when: false
      when: verify_backup_enabled

    - name: Assert the backup timer is active and scheduled
      ansible.builtin.assert:
        that:
          - verify_backup_timer.status.ActiveState == 'active'
          - verify_backup_timer.status.UnitFileState == 'enabled'
          - verify_backup_timer.status.NextElapseUSecRealtime | default('') | length > 0
        fail_msg: >-
          drupal-backup.timer is not scheduled:
          state={{ verify_backup_timer.status.ActiveState | default('?') }}
      when: verify_backup_enabled

    - name: Read the Drupal backup service state
      ansible.builtin.systemd_service:
        name: drupal-backup.service
      register: verify_backup_service
      changed_when: false
      when: verify_backup_enabled

    - name: Assert the last backup run succeeded
      ansible.builtin.assert:
        that:
          - verify_backup_service.status.Result in ['success', '']
        fail_msg: "Last drupal-backup.service run result was {{ verify_backup_service.status.Result | default('?') }}."
      when: verify_backup_enabled

    # The dumps contain every user record, and the settings archive contains the
    # database password, so the web server must not be able to read them.
    - name: Assert the backup directory is root-only
      ansible.builtin.stat:
        path: "{{ verify_backup_path }}"
      register: verify_backup_dir
      failed_when: >-
        not verify_backup_dir.stat.exists
        or verify_backup_dir.stat.pw_name != 'root'
        or verify_backup_dir.stat.rgrp or verify_backup_dir.stat.roth
      when: verify_backup_enabled

    - name: List the backup artefacts
      ansible.builtin.find:
        paths: "{{ verify_backup_path }}"
        patterns: "drupal-*.sql.gz"
      register: verify_backup_files
      when: verify_backup_enabled

    - name: Assert at least one database dump exists and is non-trivial
      ansible.builtin.assert:
        that:
          - verify_backup_files.files | length > 0
          - (verify_backup_files.files | map(attribute='size') | max) > 1024
        fail_msg: "No usable database dump found in {{ verify_backup_path }}."
      when: verify_backup_enabled

    # A dump that cannot be decompressed is not a backup. Checking integrity is
    # the cheapest available proxy for "this would actually restore".
    - name: Assert the most recent dump passes a gzip integrity check
      ansible.builtin.command:
        cmd: gzip -t {{ (verify_backup_files.files | sort(attribute='mtime') | last).path | quote }}
      changed_when: false
      when:
        - verify_backup_enabled
        - verify_backup_files.files | length > 0

    - name: Assert the most recent dump contains real Drupal data
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          zcat {{ (verify_backup_files.files | sort(attribute='mtime') | last).path | quote }}
          | grep -c 'CREATE TABLE `users_field_data`'
        executable: /bin/bash
      register: verify_backup_content
      changed_when: false
      failed_when: (verify_backup_content.stdout | trim | int) < 1
      when:
        - verify_backup_enabled
        - verify_backup_files.files | length > 0

    - name: Assert the restore script is installed and executable
      ansible.builtin.stat:
        path: /usr/local/sbin/drupal-restore.sh
      register: verify_restore_script
      failed_when: not verify_restore_script.stat.exists or not verify_restore_script.stat.xusr
      when: verify_backup_enabled


    #
    # SELinux -- only checked where it is enforcing, which today means RHEL
    #
    # These assert the labels rather than the behaviour, because the behaviour
    # they gate is already asserted above: a site that boots, serves a rendered
    # front page and completes a cron run has demonstrably reached its database
    # and written to its files directory. What the labels catch is the case
    # where all of that works because SELinux is in permissive mode, which would
    # break the moment anyone set it back to enforcing.
    #

    - name: Verify the SELinux configuration
      when: ansible_selinux.status | default('disabled') == 'enabled'
      block:

        - name: Assert SELinux is enforcing, not merely enabled
          ansible.builtin.assert:
            that:
              - ansible_selinux.mode == 'enforcing'
            fail_msg: >-
              SELinux is in {{ ansible_selinux.mode }} mode, so every context
              assertion below would pass whether or not the labels are right.

        # Read with `stat -c %C` rather than the stat module: the module only
        # populates a context field when its target-side SELinux bindings are
        # importable, and returns the dict without it otherwise -- so an
        # assertion on the module's output fails with a Jinja attribute error on
        # exactly the hosts where it matters most, instead of reporting a label.
        - name: Read the SELinux type of each path that matters
          ansible.builtin.command:
            cmd: "stat -c %C {{ item.path }}"
          register: verify_selinux_labels
          changed_when: false
          loop:
            - path: "{{ verify_base_path }}/web/sites/default/files"
              type: httpd_sys_rw_content_t
              why: >-
                Drupal cannot write uploads, image derivatives or its Twig cache
                under an enforcing policy, and the error it raises names none of
                that.
            - path: "{{ verify_base_path }}/config/sync"
              type: httpd_sys_rw_content_t
              why: Configuration export fails with a permission error that does not mention SELinux.
            # The rest of the tree must NOT be writable by the web server. If
            # this ever reports the rw type, a relabel has been applied too
            # broadly and a file upload bug becomes code execution.
            - path: "{{ verify_base_path }}/web/index.php"
              type: httpd_sys_content_t
              why: Anything else means the web server can rewrite its own code.
            # systemd refuses to exec a file typed as content, which is what
            # everything under /var/www inherits. The cron timer dies with
            # 203/EXEC and a "Permission denied" naming a file that is plainly
            # mode 0755.
            - path: "{{ verify_base_path }}/vendor/bin/drush"
              type: bin_t
              why: The drupal-cron systemd unit cannot execute it.
          loop_control:
            label: "{{ item.path }}"

        - name: Assert every path carries the type the policy needs
          ansible.builtin.assert:
            that:
              - (item.stdout | trim).split(':')[2] == item.item.type
            fail_msg: >-
              {{ item.item.path }} is labelled
              {{ (item.stdout | trim).split(':')[2] }}, expected
              {{ item.item.type }}. {{ item.item.why }}
          loop: "{{ verify_selinux_labels.results }}"
          loop_control:
            label: "{{ item.item.path }}"

        - name: Read the SELinux booleans the stack depends on
          ansible.builtin.command:
            cmd: "getsebool {{ webserver_selinux_booleans | default(['httpd_can_network_connect_db']) | join(' ') }}"
          register: verify_selinux_booleans
          changed_when: false

        - name: Assert those booleans are on
          ansible.builtin.assert:
            that:
              - verify_selinux_booleans.stdout is not search('--> off')
            fail_msg: >-
              An SELinux boolean the stack needs is off:
              {{ verify_selinux_booleans.stdout_lines | select('search', '--> off') | join(', ') }}


    #
    # firewalld -- only checked where it is running
    #

    - name: Assert the web ports are open in firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --list-services
      register: verify_firewalld
      changed_when: false
      failed_when: >-
        'http' not in verify_firewalld.stdout.split()
        or (verify_tls_enabled and 'https' not in verify_firewalld.stdout.split())
      when: ansible_facts.services['firewalld.service'].state | default('') == 'running'


    #
    # PHP tuning
    #

    # `php-fpm -i` reports the FPM SAPI's own configuration. Reading these
    # through drush or `php` would report the CLI SAPI instead, which on Debian
    # loads a different conf.d and in any case forces max_execution_time to 0 --
    # so a CLI-based check would pass even if the FPM drop-in were missing
    # entirely.
    #
    # Red Hat has a single flat /etc/php.d shared by every SAPI, so that
    # particular trap does not exist there. The assertion is still made through
    # the FPM binary on both, because what matters is what PHP-FPM loaded, not
    # what some other interpreter would have.
    - name: Read the effective PHP-FPM settings
      ansible.builtin.command:
        cmd: "{{ verify_fpm_binary }} -i"
      register: verify_php_ini
      changed_when: false

    # php -i prints "key => local_value => master_value". Lines that do not
    # match that shape (section headers, multi-line values) yield None from
    # regex_search and are dropped rather than corrupting the dict.
    - name: Parse the effective PHP-FPM settings
      ansible.builtin.set_fact:
        verify_php: >-
          {{ dict(verify_php_ini.stdout_lines
                  | map('regex_search', '^([a-z_][a-z0-9_.]*) => (.*?) => (.*)$', '\1', '\2')
                  | select('ne', None)
                  | list) }}

    - name: Assert the PHP tuning is in effect for the FPM SAPI
      ansible.builtin.assert:
        that:
          - verify_php['memory_limit'] == verify_memory_limit
          - verify_php['max_input_vars'] | int >= 2000
          - verify_php['max_execution_time'] | int > 0
          - verify_php['opcache.enable'] == 'On'
          - verify_php['expose_php'] == 'Off'
        fail_msg: >-
          PHP-FPM drop-in settings are not in effect:
          memory_limit={{ verify_php['memory_limit'] | default('?') }}
          max_execution_time={{ verify_php['max_execution_time'] | default('?') }}
          opcache={{ verify_php['opcache.enable'] | default('?') }}

    # The pool's run-as identity, read from the running processes rather than
    # from the pool file, because the file only says what should happen. Red
    # Hat's packaged pool runs as `apache`; everything under the Drupal tree is
    # owned by the web server account, so a pool left at the packaged identity
    # serves pages right up until Drupal first writes a cache entry and then
    # fails in a way that reads as a Drupal bug rather than a permissions one.
    # Selected on the worker process title rather than the executable name:
    # `ps -C php-fpm` matches nothing on Debian, where the binary is versioned
    # (php-fpm8.5), so it would report no workers at all. The title "php-fpm:
    # pool www" is set by FPM itself and is identical everywhere. Filtering to
    # pool workers also drops the master, which runs as root by design.
    - name: Read the user PHP-FPM workers run as
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          ps -eo user=,args=
          | awk '$2 == "php-fpm:" && $3 == "pool" { print $1 }'
          | sort -u
        executable: /bin/bash
      register: verify_fpm_users
      changed_when: false
      failed_when: verify_fpm_users.stdout | trim | length == 0

    - name: Assert PHP-FPM workers run as the web server account
      ansible.builtin.assert:
        that:
          - verify_fpm_users.stdout_lines | unique == [verify_webserver_user]
        fail_msg: >-
          PHP-FPM workers run as
          {{ verify_fpm_users.stdout_lines | unique | join(', ') | default('nobody', true) }}
          but the Drupal tree is owned by {{ verify_webserver_user }}. Drupal
          will fail on its first write under sites/default/files.

    - name: Assert APCu is available to the FPM SAPI
      ansible.builtin.assert:
        that:
          - "'apcu' in verify_php_ini.stdout"
        fail_msg: "APCu is not loaded in PHP-FPM; Drupal's status report will flag the cache backend."

    - name: Assert GD reports AVIF when the custom build is enabled
      ansible.builtin.assert:
        that:
          - verify_php['gd.avif_support'] | default(verify_php_ini.stdout is search('AVIF Support => enabled'))
        fail_msg: "php_gd_avif_build is enabled but PHP-FPM does not report AVIF support."
      when: verify_gd_avif | bool

    # gd_info() has been observed reporting AVIF as enabled on Ubuntu while
    # imageavif() failed at runtime, so encode a real image rather than trust it.
    # Cleans up after itself so this playbook stays read-only.
    - name: Assert GD can actually encode an AVIF image
      ansible.builtin.command:
        cmd: >-
          php -r '$f = tempnam(sys_get_temp_dir(), "avif");
          $im = imagecreatetruecolor(16, 16);
          $ok = imageavif($im, $f, 30);
          $valid = $ok && filesize($f) > 0;
          unlink($f);
          if (!$valid) { exit(1); }
          echo "ok";'
      register: verify_avif_encode
      changed_when: false
      failed_when: verify_avif_encode.stdout is not search('ok')
      when: verify_gd_avif | bool

    # The whole point of the private prefix is that apt keeps managing the
    # system libgd3. If this ever fails, the build clobbered a distro package.
    - name: Assert the system libgd3 is still the unmodified distribution package
      ansible.builtin.command:
        cmd: dpkg -V libgd3
      register: verify_libgd_intact
      changed_when: false
      failed_when: verify_libgd_intact.rc != 0
      when: verify_gd_avif | bool

    - name: Assert the PHP and web server upload limits agree
      ansible.builtin.assert:
        that:
          - verify_php['upload_max_filesize'] | upper == verify_max_body_size | upper
        fail_msg: >-
          upload_max_filesize ({{ verify_php['upload_max_filesize'] }}) does not
          match the web server body limit ({{ verify_max_body_size }}), which
          produces confusing 413s at the boundary.


    #
    # TLS -- only checked when webserver_tls_enabled is true
    #

    - name: Assert HTTP redirects to HTTPS
      ansible.builtin.uri:
        url: "http://{{ verify_sitename }}/"
        follow_redirects: none
        status_code: 301
      register: verify_redirect
      failed_when: >-
        verify_redirect.location is not defined
        or not verify_redirect.location.startswith('https://')
      when: verify_tls_enabled

    - name: Assert the ACME challenge path is still reachable over HTTP
      ansible.builtin.uri:
        url: "http://{{ verify_sitename }}/.well-known/acme-challenge/verify-probe"
        status_code: [404, 403]
        follow_redirects: none
      when: verify_tls_enabled

    - name: Assert HSTS is set and Drupal knows the request was over TLS
      ansible.builtin.assert:
        that:
          - verify_frontpage.strict_transport_security is defined
          - "'http://' ~ verify_sitename not in verify_frontpage.content"
        fail_msg: >-
          HTTPS responded but either HSTS is missing or Drupal is still
          generating http:// URLs (check fastcgi_param HTTPS on).
      when: verify_tls_enabled

    - name: Assert the negotiated protocol is TLS 1.2 or better
      ansible.builtin.command:
        cmd: >-
          openssl s_client -connect 127.0.0.1:443
          -servername {{ verify_sitename }} -tls1_2 -brief
      register: verify_tls_proto
      changed_when: false
      failed_when: verify_tls_proto.rc != 0
      when: verify_tls_enabled

    - name: Assert TLS 1.0 and 1.1 are refused
      ansible.builtin.command:
        cmd: >-
          openssl s_client -connect 127.0.0.1:443
          -servername {{ verify_sitename }} -tls1_1 -brief
      register: verify_tls_old
      changed_when: false
      failed_when: verify_tls_old.rc == 0
      when: verify_tls_enabled

    # service_facts only enumerates .service units, so the timer has to be
    # queried directly. Calling systemd_service with neither state nor enabled
    # only reads status; it does not change anything.
    - name: Assert the certbot renewal timer is active
      ansible.builtin.systemd_service:
        name: certbot.timer
      register: verify_certbot_timer
      changed_when: false
      failed_when: verify_certbot_timer.status.ActiveState != 'active'
      when: verify_tls_enabled

    - name: Assert the renewal deploy hook is installed and executable
      ansible.builtin.stat:
        path: /etc/letsencrypt/renewal-hooks/deploy/reload-webserver.sh
      register: verify_deploy_hook
      failed_when: >-
        not verify_deploy_hook.stat.exists
        or not verify_deploy_hook.stat.xusr
      when: verify_tls_enabled

    # Opt in with -e verify_check_renewal=true. This performs a real ACME
    # transaction against Let's Encrypt: it takes a couple of minutes, counts
    # against rate limits, and fails intermittently on transient authorization
    # state that says nothing about this host's configuration. The renewal
    # timer, deploy hook and certificate expiry are all checked above without
    # touching the network, so routine verification does not need it.
    - name: Assert a certbot dry-run renewal succeeds
      ansible.builtin.command:
        cmd: certbot renew --dry-run --cert-name {{ verify_sitename }}
      register: verify_renew
      changed_when: false
      when:
        - verify_tls_enabled
        - verify_check_renewal

    - name: Check the certificate is not close to expiry
      ansible.builtin.command:
        cmd: "openssl x509 -in /etc/letsencrypt/live/{{ verify_sitename }}/fullchain.pem -noout -checkend 1209600"
      register: verify_cert_expiry
      changed_when: false
      failed_when: verify_cert_expiry.rc != 0
      when: verify_tls_enabled

    - name: Assert the Cloudflare credentials file is not world or group readable
      ansible.builtin.stat:
        path: /etc/letsencrypt/cloudflare.ini
      register: verify_cf_creds
      failed_when: verify_cf_creds.stat.exists and (verify_cf_creds.stat.rgrp or verify_cf_creds.stat.roth)
      when: verify_tls_enabled
