---

- name: Assert the target is a supported OS
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_release in common_supported_releases
    fail_msg: >-
      This role supports Ubuntu {{ common_supported_releases | join(', ') }} only.
      Detected {{ ansible_distribution }} {{ ansible_distribution_version }}
      ({{ ansible_distribution_release }}).
    success_msg: >-
      {{ ansible_distribution }} {{ ansible_distribution_version }}
      ({{ ansible_distribution_release }}) detected.

# 26.04 moves to PHP 8.5 and MariaDB 11.8. Nothing here pins either version --
# the PHP version is discovered at runtime -- but Drupal 11 only recommends up
# to PHP 8.4, so this is worth stating plainly rather than letting a deploy
# imply the combination is supported.
- name: Warn when running on a release that is supported but not yet proven
  ansible.builtin.debug:
    msg: >-
      {{ ansible_distribution_release }} is EXPERIMENTAL for these roles.
      Ubuntu 24.04 (noble) is the tested target. Drupal 11 recommends PHP 8.4;
      {{ ansible_distribution_release }} ships PHP 8.5, which Drupal core
      supports from 11.3 but which contributed modules may not.
  when: ansible_distribution_release not in common_tested_releases

# Refreshing the package index is not a change to system state, so it is not
# reported as one. Otherwise every run made more than cache_valid_time after the
# last one reports a change and idempotency can never be measured.
- name: Update apt package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

# The nginx package creates www-data itself. We only assert it is
# present rather than creating it, because rewriting an existing system user's
# home directory or shell is invasive and is not needed by anything here.
- name: Look up the web server account
  ansible.builtin.getent:
    database: passwd
    key: "{{ webserver_user }}"
  register: webserver_account
  failed_when: false

- name: Create the web server group when it does not already exist
  ansible.builtin.group:
    name: "{{ webserver_group }}"
    system: true
    state: present

- name: Create the web server user when it does not already exist
  ansible.builtin.user:
    name: "{{ webserver_user }}"
    group: "{{ webserver_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present
  when: webserver_account.ansible_facts.getent_passwd is not defined
