---

# One identifier for the running platform, so the supported and tested lists
# stay flat and readable rather than becoming a nested structure that has to be
# searched. Ubuntu contributes its codename, Red Hat its name and major version.
- name: Identify the running platform
  ansible.builtin.set_fact:
    common_platform: >-
      {{ ansible_distribution_release if ansible_os_family == 'Debian'
         else (ansible_distribution | lower | replace(' ', '')
               ~ ansible_distribution_major_version) }}

- name: Assert the target is a supported OS
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
      - common_platform in common_supported_releases
    fail_msg: >-
      These roles support {{ common_supported_releases | join(', ') }} only.
      Detected {{ ansible_distribution }} {{ ansible_distribution_version }}
      (identified as "{{ common_platform }}").
    success_msg: >-
      {{ ansible_distribution }} {{ ansible_distribution_version }}
      (identified as "{{ common_platform }}") detected.

# Ubuntu 26.04 moves to PHP 8.5 and MariaDB 11.8; RHEL 9 has no CI runner at
# all. Nothing here pins a version -- the PHP version is discovered at runtime --
# but both facts are worth stating plainly rather than letting a deploy imply a
# guarantee that is not there.
- name: Warn when running on a platform that is supported but not proven by CI
  ansible.builtin.debug:
    msg: >-
      {{ common_platform }} is EXPERIMENTAL for these roles: it has no blocking
      CI leg, so it is validated by hand rather than on every push.
      {{ 'Drupal 11 recommends PHP 8.4; ' ~ ansible_distribution_release
         ~ ' ships PHP 8.5, which Drupal core supports from 11.3 but which
         contributed modules may not.'
         if ansible_os_family == 'Debian'
         else 'PHP, MariaDB and nginx all come from AppStream module streams
         that roles/web and roles/db enable explicitly, because the non-modular
         defaults (PHP 8.0, MariaDB 10.5) are too old for Drupal 11.' }}
  when: common_platform not in common_tested_releases

# Refreshing the package index is not a change to system state, so it is not
# reported as one. Otherwise every run made more than cache_valid_time after the
# last one reports a change and idempotency can never be measured.
- name: Update apt package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false
  when: ansible_os_family == 'Debian'

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  when: ansible_os_family == 'Debian'

# dnf refreshes metadata on its own schedule, so there is no separate cache task
# to keep out of the change count.
- name: Install common packages
  ansible.builtin.dnf:
    name: "{{ common_packages + common_packages_redhat }}"
    state: present
  when: ansible_os_family == 'RedHat'

# The nginx package creates its own run-as account -- www-data on Debian, nginx
# on Red Hat -- but roles/common runs before roles/web installs it. We only
# assert the account is present rather than creating it where it already exists,
# because rewriting an existing system user's home directory or shell is
# invasive and is not needed by anything here.
- name: Look up the web server account
  ansible.builtin.getent:
    database: passwd
    key: "{{ webserver_user }}"
  register: webserver_account
  failed_when: false

- name: Create the web server group when it does not already exist
  ansible.builtin.group:
    name: "{{ webserver_group }}"
    system: true
    state: present

- name: Create the web server user when it does not already exist
  ansible.builtin.user:
    name: "{{ webserver_user }}"
    group: "{{ webserver_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present
  when: webserver_account.ansible_facts.getent_passwd is not defined
