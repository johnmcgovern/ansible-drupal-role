---
# Ubuntu releases these roles will deploy to.
common_supported_releases:
  - noble      # 24.04 LTS -- PHP 8.3, MariaDB 10.11
  - resolute   # 26.04 LTS -- PHP 8.5, MariaDB 11.8

# Releases covered by a green integration run in CI. Anything supported but not
# listed here warns at the start of the play. Both entries are blocking legs of
# the integration workflow, so this list and CI cannot drift apart silently.
common_tested_releases:
  - noble
  - resolute

# Web server run-as identity. Ubuntu's nginx package runs as www-data and
# creates this user/group itself.
webserver_user: www-data
webserver_group: www-data

# Packages needed by later roles (Composer needs unzip/git, MySQL modules need
# python3-pymysql, which is installed by the db role).
common_packages:
  # acl lets Ansible hand a temp file to an unprivileged become_user without
  # making it world readable. Drush runs as the web server account so that its
  # caches are not written as root.
  - acl
  - ca-certificates
  - curl
  - git
  - python3
  - unzip
