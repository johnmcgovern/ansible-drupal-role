---
drupal_base_path: /var/www/drupal

# Drupal release to install. Empty installs the newest stable, which is what
# most deployments want. Pin to an exact version ("11.4.4") to stand a site up
# on a known release -- useful for reproducing a bug, or for staging an upgrade
# rehearsal. This only affects a first install: once composer.json exists the
# codebase is never re-created, so changing this on an existing host does
# nothing. Use upgrade.yml to move an installed site forward.
drupal_version: ""

# Mirrors roles/common/defaults. Role defaults do not carry across plays, and
# the drupal role runs in its own play, so the OS-derived identity is repeated
# rather than inherited.
webserver_user: "{{ 'nginx' if ansible_os_family == 'RedHat' else 'www-data' }}"
webserver_group: "{{ 'nginx' if ansible_os_family == 'RedHat' else 'www-data' }}"

drupal_sitename: Drupal Site
drupal_email: admin@example.com
drupal_region: en

drupal_admin: admin

# Address on the uid 1 account. Separate from drupal_email, which is the site's
# own "from" address, but defaulting to it because on a single-admin site they
# are usually the same. Without this, site:install falls back to Drush's own
# built-in default of admin@example.com and the account silently ends up with an
# address nobody owns -- which matters, because that is where a password reset
# link goes.
drupal_admin_email: "{{ drupal_email }}"

# Drupal resolves config_sync_directory relative to the docroot ({{ drupal_base_path }}/web),
# so '../config/sync' lands at {{ drupal_base_path }}/config/sync -- outside the
# docroot, which is where it belongs.
drupal_config_sync_relative: ../config/sync
drupal_config_sync_path: "{{ drupal_base_path }}/config/sync"

# The hash salt is generated once on the target and read by settings.php at
# runtime. Keeping it in its own file outside the docroot means re-running this
# playbook cannot overwrite the value an existing site is already using.
drupal_hash_salt_file: "{{ drupal_base_path }}/.hash_salt"

drupal_drush: "{{ drupal_base_path }}/vendor/bin/drush"

# Drush bootstraps Drupal, which writes the twig cache under
# sites/default/files. Running it as root leaves root-owned files there that the
# web server cannot rewrite, so every drush invocation runs as the web server
# account instead. That account's home is not writable, hence the explicit HOME.
drupal_drush_env:
  HOME: /tmp

# Red Hat only. SELinux is enforcing, and the directories Drupal writes to need
# httpd_sys_rw_content_t rather than the httpd_sys_content_t the rest of the
# tree inherits from /var/www. roles/web registers the file context rules;
# relabelling happens here because it cannot run until the directories exist.
drupal_selinux_relabel: true

# Database connection as seen from the web server. Kept as variables so the web
# and db tiers can be split across hosts; settings.php no longer hardcodes
# localhost.
#
# These four mirror roles/db/defaults deliberately, and the duplication is not
# an oversight. Role defaults do not carry across plays, and site.yml runs the
# db and drupal roles in two separate plays -- so without a copy here,
# settings.php.j2 renders with db_name undefined on any host whose group_vars
# does not happen to set it, and the failure surfaces inside a no_log task as an
# error with no variable name in it. tests/check-vars-drift.py enforces that
# every role defaults everything it uses, which is what keeps these in step.
db_host: localhost
db_name: drupal
db_user: drupal_user
db_port: 3306
db_service: mariadb

# Used in the systemd unit descriptions. Mirrors roles/web/defaults for the same
# cross-play reason as the database settings above.
webserver_sitename: drupal.example.com

# Host header protection. Empty means disabled -- a misconfigured pattern makes
# the site unreachable, so it is opt-in. Supply a list of regular expressions.
drupal_trusted_host_patterns: []

# Drupal 12 will default this to FALSE. Defaulting to FALSE here matches that
# future behaviour, so a major upgrade does not silently change how forms
# validate. Set true to keep browser-side HTML5 validation on.
drupal_enable_html5_validation: false

#
# Cron
#
# Drupal needs cron for queue processing, cache expiry, search indexing and
# update checks. A systemd timer replaces Drupal's automated_cron module, which
# only runs during page requests and so makes a visitor wait for it.
drupal_cron_enabled: true

# systemd OnCalendar expression. "hourly" suits most sites; a busy site with
# queues or search indexing may want "*:0/15" for every fifteen minutes.
drupal_cron_on_calendar: hourly

# Jitter, so several sites on one host do not all fire simultaneously.
drupal_cron_randomized_delay: 300

drupal_cron_timeout: 600

# Run the unit once during deployment to prove it works, rather than finding out
# at the first scheduled run.
drupal_cron_run_on_deploy: true

#
# Backups
#
# A systemd timer dumps the database and archives the files directory. The dump
# goes through MariaDB's unix_socket authentication as root, so no database
# password is written to disk, and the backup directory is root-only.
drupal_backup_enabled: true

drupal_backup_path: /var/backups/drupal
drupal_backup_on_calendar: daily
drupal_backup_randomized_delay: 1800
drupal_backup_retention_days: 14
drupal_backup_timeout: 3600

# Dump the schema of cache tables but not their contents. They are regenerated
# on demand and on a busy site can be larger than the real data.
drupal_backup_exclude_cache: true

# Regenerated automatically, so not worth the archive space. Image derivatives
# under styles/ are deliberately NOT excluded: they are also regenerable, but
# rebuilding them all at once after a restore is expensive.
drupal_backup_files_exclude:
  - php
  - css
  - js

# Take one backup during deployment to prove the path works.
drupal_backup_run_on_deploy: true

#
# Password hashing
#
# Drupal's default is PHP's PASSWORD_DEFAULT (bcrypt); Drupal 12 will default to
# argon2id and the status report recommends switching now. Existing bcrypt
# hashes keep working -- password_verify() reads the algorithm from the hash
# itself -- and Drupal rehashes each user's password on their next login.
#
# Must be an identifier from PHP's password_algos(), so "argon2id", not
# "PASSWORD_ARGON2ID". An unrecognised value silently falls back to the PHP
# default, which is why tests/verify.yml asserts the algorithm actually in use.
# Set to an empty string to leave PHP's default in place.
drupal_password_algorithm: argon2id

# Options for password_hash(). Empty uses PHP's defaults, which for argon2id are
# 64 MiB memory, 4 iterations and 1 thread. Raising memory_cost strengthens the
# hash but costs RAM per concurrent login.
drupal_password_options: {}

drupal_install_modules: []
drupal_enable_modules: []

# Pinned upstream installer checksum source. The installer is verified against
# the SHA-384 that Composer publishes before it is executed.
composer_installer_sig_url: https://composer.github.io/installer.sig

# Composer is invoked by absolute path rather than by name. Red Hat's sudoers
# sets secure_path to /sbin:/bin:/usr/sbin:/usr/bin, which excludes
# /usr/local/bin, so a bare `composer` is not found under become even though it
# is on an interactive PATH -- Ubuntu's secure_path happens to include it, which
# is the only reason the bare name ever worked.
composer_bin_dir: /usr/local/bin
composer_bin: "{{ composer_bin_dir }}/composer"

# Composer runs as root here (it writes into /var/www). Without COMPOSER_HOME it
# guesses at a cache location, and without ALLOW_SUPERUSER it emits an
# interactive-looking root warning on every invocation.
drupal_composer_env:
  COMPOSER_HOME: /root/.composer
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_NO_INTERACTION: "1"
