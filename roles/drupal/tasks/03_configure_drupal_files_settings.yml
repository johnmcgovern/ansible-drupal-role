---

# The salt is generated once and never regenerated. Previously the salt lived
# inline in settings.php as an empty string for drush to fill in; on a second
# playbook run the template rewrote it back to empty while the install marker
# suppressed the reinstall, leaving a live site with no hash salt.
- name: Generate the Drupal hash salt if it does not exist
  ansible.builtin.shell:
    cmd: set -o pipefail && openssl rand -base64 64 | tr -d '\n' > {{ drupal_hash_salt_file }}
    executable: /bin/bash
    creates: "{{ drupal_hash_salt_file }}"

- name: Lock down the hash salt file
  ansible.builtin.file:
    path: "{{ drupal_hash_salt_file }}"
    state: file
    owner: root
    group: "{{ webserver_group }}"
    mode: "0440"

# Drupal resolves this path relative to the docroot, so '../config/sync' means
# {{ drupal_base_path }}/config/sync. The previous version created it under
# web/config/sync, which Drupal never looked at.
- name: Create the config sync directory
  ansible.builtin.file:
    path: "{{ drupal_config_sync_path }}"
    state: directory
    owner: "{{ webserver_user }}"
    group: "{{ webserver_group }}"
    mode: "0750"

- name: Write Drupal settings.php
  ansible.builtin.template:
    src: settings.php.j2
    dest: "{{ drupal_base_path }}/web/sites/default/settings.php"
    owner: root
    group: "{{ webserver_group }}"
    mode: "0440"
  no_log: true
  notify: Rebuild Drupal cache

# Container parameters, currently the password hashing algorithm. Changing this
# alters the compiled service container, so the cache has to be rebuilt before
# it takes effect -- hence the handler.
- name: Write Drupal services.yml
  ansible.builtin.template:
    src: services.yml.j2
    dest: "{{ drupal_base_path }}/web/sites/default/services.yml"
    owner: root
    group: "{{ webserver_group }}"
    mode: "0440"
  notify: Rebuild Drupal cache

- name: Lock down sites/default
  ansible.builtin.file:
    path: "{{ drupal_base_path }}/web/sites/default"
    state: directory
    owner: root
    group: "{{ webserver_group }}"
    mode: "0550"

- name: Create the writable files directory
  ansible.builtin.file:
    path: "{{ drupal_base_path }}/web/sites/default/files"
    state: directory
    owner: "{{ webserver_user }}"
    group: "{{ webserver_group }}"
    mode: "0770"

# Red Hat only. Ownership and mode are not the whole story when SELinux is
# enforcing: a directory can be owned by the web server account, mode 0770, and
# still be unwritable because its type says it is static content. roles/web
# registered the file context rules; this applies them, and it has to happen
# here because restorecon needs the directories to exist.
#
# Composer created most of this tree as root after roles/web ran, so the whole
# base path is relabelled rather than just the two writable directories -- new
# files inherit their parent's type, and anything Composer wrote before the
# rules existed would otherwise keep the type it inherited at the time.
- name: Apply the SELinux file contexts to the Drupal tree
  when:
    - ansible_os_family == 'RedHat'
    - drupal_selinux_relabel
    - ansible_selinux.status | default('disabled') == 'enabled'
  block:

    # restorecon has no check mode and always exits 0, so the only way to know
    # whether it would change anything -- and to avoid reporting changed on
    # every single run -- is to ask it what it would do first.
    - name: Check which files are mislabelled
      ansible.builtin.command:
        cmd: "restorecon -R -n -v {{ drupal_base_path }}"
      register: drupal_selinux_pending
      changed_when: false

    - name: Relabel the mislabelled files  # noqa: no-handler
      ansible.builtin.command:
        cmd: "restorecon -R {{ drupal_base_path }}"
      when: drupal_selinux_pending.stdout | trim | length > 0
      changed_when: true
