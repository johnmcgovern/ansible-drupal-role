---
# nginx (default) or apache
webserver_type: nginx

# Mirrors roles/common/defaults. Role defaults do not carry across plays.
webserver_user: www-data
webserver_group: www-data

# Docroot the vhost points at. Must match roles/drupal drupal_base_path.
drupal_base_path: /var/www/drupal

webserver_sitename: drupal.example.com
webserver_email: admin@example.com

# Maximum upload size accepted by the web server. Keep this at or above the
# php.ini upload_max_filesize so the two do not disagree.
webserver_max_body_size: 64M

# PHP extensions Drupal 11 needs, plus apcu for the opcode/object cache.
# php-uploadprogress ships in the noble universe component, so no third-party
# PPA is required on 24.04.
#
# NOTE: the bare `php` metapackage is deliberately NOT listed. It depends on
# php8.3, whose first Depends alternative is libapache2-mod-php8.3, so apt
# installs apache2 as a side effect -- which then binds port 80 and stops nginx
# from starting. php-cli gives the same interpreter without the web server.
php_packages:
  - php-apcu
  - php-cli
  - php-curl
  - php-gd
  - php-mbstring
  - php-mysql
  - php-opcache
  - php-uploadprogress
  - php-xml
  - php-zip
