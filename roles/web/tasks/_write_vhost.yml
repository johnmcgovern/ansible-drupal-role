---
# Shared by 03_webserver_vhost_config.yml and 04_tls.yml. The vhost is written
# once before the certificate exists (HTTP only, serving ACME challenges) and
# again afterwards with the TLS block enabled, so this lives in one place.

- name: Write Nginx conf file
  ansible.builtin.template:
    src: nginx-drupal.j2
    dest: "{{ webserver_vhost_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx
