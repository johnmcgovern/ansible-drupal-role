---

# Apache support was removed. This gives anyone carrying webserver_type in their
# group_vars a clear message instead of silently deploying something other than
# what they asked for.
- name: Fail if a removed web server is requested
  ansible.builtin.assert:
    that:
      - webserver_type | default('nginx') == 'nginx'
    fail_msg: >-
      Apache support has been removed; these roles install nginx only.
      Remove webserver_type from your variables, or set it to 'nginx'.

# OPcache ships as a separate php-opcache package through PHP 8.4. Ubuntu 26.04
# (PHP 8.5) has no such package, and naming it aborts the whole apt transaction.
# Detected rather than keyed off the release name, so a future release that
# brings it back, or drops another optional package, needs no change here.
- name: Check which optional PHP packages this release provides
  ansible.builtin.command:
    cmd: "apt-cache policy {{ item }}"
  register: php_optional_policy
  changed_when: false
  loop: "{{ php_packages_optional }}"

- name: Register the optional PHP packages that are installable
  ansible.builtin.set_fact:
    php_packages_available: >-
      {{ php_optional_policy.results
         | selectattr('stdout', 'search', 'Candidate:\s*(?!\(none\))\S')
         | map(attribute='item') | list }}

- name: Report optional PHP packages this release does not provide
  ansible.builtin.debug:
    msg: >-
      Not available on {{ ansible_distribution_release }}, skipping:
      {{ php_packages_optional | difference(php_packages_available) | join(', ') }}
  when: (php_packages_optional | difference(php_packages_available)) | length > 0

- name: Install PHP and PHP modules
  ansible.builtin.apt:
    name: "{{ php_packages + php_packages_available }}"
    state: present

# Everything downstream (the FPM socket path, the service name, the systemd
# unit to restart) is keyed off the real interpreter version rather than a
# hardcoded 8.3, so a point release that moves PHP forward does not break this.
- name: Determine the installed PHP version
  ansible.builtin.command:
    cmd: php -r "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;"
  register: php_version_result
  changed_when: false

- name: Register the PHP version and derived FPM paths
  ansible.builtin.set_fact:
    php_version: "{{ php_version_result.stdout | trim }}"
    php_fpm_service: "php{{ php_version_result.stdout | trim }}-fpm"
    php_fpm_socket: "/run/php/php{{ php_version_result.stdout | trim }}-fpm.sock"

# Nothing here installs Apache, but a host may already have it from an earlier
# deployment or a preinstalled image. It would hold port 80 and stop nginx from
# starting, so it is shut down if present.
- name: Stop and disable Apache if it is installed
  ansible.builtin.service:
    name: apache2
    state: stopped
    enabled: false
  failed_when: false

- name: Install Nginx and PHP-FPM
  ansible.builtin.apt:
    name:
      - nginx
      - "php{{ php_version }}-fpm"
    state: present

# nginx 1.25.1 replaced the `http2` parameter of the listen directive with a
# standalone `http2 on;`. Noble ships 1.24, so the vhost has to emit whichever
# form the installed build understands.
- name: Determine the installed Nginx version
  ansible.builtin.command:
    cmd: nginx -v
  register: nginx_version_result
  changed_when: false

- name: Register the Nginx version
  ansible.builtin.set_fact:
    webserver_nginx_version: "{{ nginx_version_result.stderr | regex_search('nginx/([0-9.]+)', '\\1') | first }}"

- name: Ensure PHP-FPM is running and enabled
  ansible.builtin.service:
    name: "{{ php_fpm_service }}"
    state: started
    enabled: true

- name: Confirm the PHP-FPM socket exists at the expected path
  ansible.builtin.stat:
    path: "{{ php_fpm_socket }}"
  register: php_fpm_socket_stat

- name: Fail early if the PHP-FPM socket is missing
  ansible.builtin.fail:
    msg: >-
      Expected PHP-FPM socket at {{ php_fpm_socket }} but it does not exist.
      The nginx vhost would return 502 for every request.
  when: not php_fpm_socket_stat.stat.exists
