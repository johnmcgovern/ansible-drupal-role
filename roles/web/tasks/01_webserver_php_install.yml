---

# Apache support was removed. This gives anyone carrying webserver_type in their
# group_vars a clear message instead of silently deploying something other than
# what they asked for.
- name: Fail if a removed web server is requested
  ansible.builtin.assert:
    that:
      - webserver_type | default('nginx') == 'nginx'
    fail_msg: >-
      Apache support has been removed; these roles install nginx only.
      Remove webserver_type from your variables, or set it to 'nginx'.

#
# AppStream module streams -- Red Hat only
#
# RHEL 9's non-modular packages are PHP 8.0 and nginx 1.20. Drupal 11 requires
# PHP 8.3, so `dnf install php-cli` without enabling a stream first installs an
# interpreter Drupal refuses to run on. Enabling a stream also pins it: once
# php:8.3 is enabled, dnf will not silently move the host to another stream.
- name: Enable the required DNF module streams
  when: ansible_os_family == 'RedHat'
  block:

    - name: Read the currently enabled DNF module streams
      ansible.builtin.command:
        cmd: dnf --quiet module list --enabled
      register: web_dnf_enabled
      changed_when: false

    # There is no module in ansible.builtin for module streams, and enabling one
    # is not something `dnf: name=@php:8.3` expresses without also installing a
    # profile's worth of packages we have not asked for.
    - name: Enable the module stream  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "dnf --assumeyes module enable {{ item.name }}:{{ item.stream }}"
      loop: "{{ web_dnf_module_streams }}"
      loop_control:
        label: "{{ item.name }}:{{ item.stream }}"
      when: >-
        web_dnf_enabled.stdout is not search('(?m)^' ~ item.name ~ '\s+'
                                             ~ (item.stream | regex_escape) ~ '\s')
      changed_when: true

# OPcache ships as a separate php-opcache package through PHP 8.4. Ubuntu 26.04
# (PHP 8.5) has no such package, and RHEL has no php-pecl-uploadprogress outside
# EPEL. Naming a package the manager does not have aborts the whole transaction,
# so availability is probed rather than assumed. Detected rather than keyed off
# the release name, so a future release that brings a package back, or drops
# another one, needs no change here.
- name: Check which optional PHP packages this release provides
  ansible.builtin.command:
    cmd: "apt-cache policy {{ item }}"
  register: php_optional_policy
  changed_when: false
  loop: "{{ php_packages_optional }}"
  when: ansible_os_family == 'Debian'

# Deliberately `dnf list` and not `dnf list --available`: --available excludes
# packages that are already installed, so on the second run it reports every
# optional package this role installed on the first as missing, uninstalls
# nothing but stops reinstalling it, and idempotency quietly fails. Plain
# `dnf list` covers installed and available alike.
- name: Check which optional PHP packages this release provides
  ansible.builtin.command:
    cmd: "dnf --quiet list {{ item }}"
  register: php_optional_dnf
  changed_when: false
  failed_when: false
  loop: "{{ php_packages_optional }}"
  when: ansible_os_family == 'RedHat'

# apt-cache policy always exits 0 and reports "Candidate: (none)" for a package
# it knows of but cannot install, so the candidate line is what has to be read.
# dnf list simply exits non-zero when nothing matches, which is unambiguous.
- name: Register the optional PHP packages that are installable
  ansible.builtin.set_fact:
    php_packages_available: >-
      {{ (php_optional_policy.results
          | selectattr('stdout', 'search', 'Candidate:\s*(?!\(none\))\S')
          | map(attribute='item') | list)
         if ansible_os_family == 'Debian'
         else (php_optional_dnf.results
               | selectattr('rc', 'equalto', 0)
               | map(attribute='item') | list) }}

- name: Report optional PHP packages this release does not provide
  ansible.builtin.debug:
    msg: >-
      Not available on {{ ansible_distribution }}
      {{ ansible_distribution_major_version }}, skipping:
      {{ php_packages_optional | difference(php_packages_available) | join(', ') }}
  when: (php_packages_optional | difference(php_packages_available)) | length > 0

- name: Install PHP and PHP modules
  ansible.builtin.apt:
    name: "{{ php_packages + php_packages_available }}"
    state: present
  when: ansible_os_family == 'Debian'

- name: Install PHP and PHP modules
  ansible.builtin.dnf:
    name: "{{ php_packages + php_packages_available }}"
    state: present
  when: ansible_os_family == 'RedHat'

# Everything downstream (the FPM socket path, the service name, the systemd
# unit to restart) is keyed off the real interpreter version rather than a
# hardcoded 8.3, so a point release that moves PHP forward does not break this.
- name: Determine the installed PHP version
  ansible.builtin.command:
    cmd: php -r "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;"
  register: php_version_result
  changed_when: false

# The two distributions lay PHP out completely differently, and every path below
# is derived here so that no later task has to branch again:
#
#   Debian  one tree per interpreter version, split by SAPI --
#           /etc/php/8.3/{cli,fpm}/conf.d -- with a versioned service and
#           binary, so several PHP versions can be installed side by side.
#   RedHat  a single flat /etc/php.d shared by every SAPI, one unversioned
#           php-fpm service and binary, because only one PHP can be installed.
#
# The flat layout means the CLI-vs-FPM distinction Debian makes does not exist
# on Red Hat: the same drop-in serves both. tests/verify.yml still reads its
# settings through the FPM SAPI on both, so the assertion tests what PHP-FPM
# actually loaded either way.
- name: Register the PHP version and derived FPM paths
  ansible.builtin.set_fact:
    php_version: "{{ php_version_result.stdout | trim }}"
    php_fpm_service: >-
      {{ 'php-fpm' if ansible_os_family == 'RedHat'
         else 'php' ~ (php_version_result.stdout | trim) ~ '-fpm' }}
    php_fpm_socket: >-
      {{ '/run/php-fpm/www.sock' if ansible_os_family == 'RedHat'
         else '/run/php/php' ~ (php_version_result.stdout | trim) ~ '-fpm.sock' }}
    php_fpm_binary: >-
      {{ 'php-fpm' if ansible_os_family == 'RedHat'
         else 'php-fpm' ~ (php_version_result.stdout | trim) }}
    php_fpm_pool_file: >-
      {{ '/etc/php-fpm.d/www.conf' if ansible_os_family == 'RedHat'
         else '/etc/php/' ~ (php_version_result.stdout | trim) ~ '/fpm/pool.d/www.conf' }}
    php_conf_dirs: >-
      {{ ['/etc/php.d'] if ansible_os_family == 'RedHat'
         else ['/etc/php/' ~ (php_version_result.stdout | trim) ~ '/cli/conf.d',
               '/etc/php/' ~ (php_version_result.stdout | trim) ~ '/fpm/conf.d'] }}

# Nothing here installs Apache, but a host may already have it from an earlier
# deployment or a preinstalled image. It would hold port 80 and stop nginx from
# starting, so it is shut down if present under either name.
- name: Stop and disable Apache if it is installed
  ansible.builtin.service:
    name: "{{ 'httpd' if ansible_os_family == 'RedHat' else 'apache2' }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Install Nginx and PHP-FPM
  ansible.builtin.apt:
    name:
      - nginx
      - "php{{ php_version }}-fpm"
    state: present
  when: ansible_os_family == 'Debian'

- name: Install Nginx and PHP-FPM
  ansible.builtin.dnf:
    name:
      - nginx
      - php-fpm
    state: present
  when: ansible_os_family == 'RedHat'

# Red Hat's php-common and php-fpm create these root:apache 0770, matching the
# pool user the packaging assumes. 02_php_tuning.yml repoints the pool at the
# web server account, which would otherwise leave PHP unable to write a session
# -- visible only as users being silently logged out again.
- name: Hand PHP's runtime directories to the web server account
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ webserver_user }}"
    group: "{{ webserver_group }}"
    mode: "0770"
  loop: "{{ php_runtime_dirs_redhat }}"
  when: ansible_os_family == 'RedHat'

# nginx 1.25.1 replaced the `http2` parameter of the listen directive with a
# standalone `http2 on;`. Noble ships 1.24, so the vhost has to emit whichever
# form the installed build understands.
- name: Determine the installed Nginx version
  ansible.builtin.command:
    cmd: nginx -v
  register: nginx_version_result
  changed_when: false

- name: Register the Nginx version
  ansible.builtin.set_fact:
    webserver_nginx_version: "{{ nginx_version_result.stderr | regex_search('nginx/([0-9.]+)', '\\1') | first }}"

- name: Ensure PHP-FPM is running and enabled
  ansible.builtin.service:
    name: "{{ php_fpm_service }}"
    state: started
    enabled: true

- name: Confirm the PHP-FPM socket exists at the expected path
  ansible.builtin.stat:
    path: "{{ php_fpm_socket }}"
  register: php_fpm_socket_stat

- name: Fail early if the PHP-FPM socket is missing
  ansible.builtin.fail:
    msg: >-
      Expected PHP-FPM socket at {{ php_fpm_socket }} but it does not exist.
      The nginx vhost would return 502 for every request.
  when: not php_fpm_socket_stat.stat.exists
