---

# Decide up front whether this host already has a certificate. Without this the
# first pass would write an HTTP-only vhost on every run and 04_tls.yml would
# immediately rewrite it with TLS again -- two changes and two restarts on a
# host that is already converged.
- name: Check for an existing TLS certificate
  ansible.builtin.stat:
    path: "{{ webserver_tls_cert_dir }}/fullchain.pem"
  register: webserver_tls_existing_cert
  when: webserver_tls_enabled

- name: Enable the TLS vhost when a certificate already exists
  ansible.builtin.set_fact:
    webserver_tls_active: >-
      {{ webserver_tls_enabled | bool
         and (webserver_tls_existing_cert.stat.exists | default(false)) }}

# On a first run this writes an HTTP-only vhost, because nginx refuses to start
# when ssl_certificate points at a file that does not exist yet. 04_tls.yml
# rewrites it once certbot has issued the certificate.
- name: Write the web server vhost
  ansible.builtin.include_tasks: _write_vhost.yml

- name: Create the ACME challenge webroot
  ansible.builtin.file:
    path: "{{ webserver_acme_webroot }}/.well-known/acme-challenge"
    state: directory
    owner: root
    group: "{{ webserver_group }}"
    mode: "0755"


#
# Apache
#

- name: Disable the Apache2 default vhost
  ansible.builtin.file:
    path: /etc/apache2/sites-enabled/000-default.conf
    state: absent
  when: webserver_type == 'apache'
  notify: Restart apache2

- name: Enable the Drupal Apache2 vhost
  ansible.builtin.file:
    src: /etc/apache2/sites-available/01-drupal.conf
    dest: /etc/apache2/sites-enabled/01-drupal.conf
    state: link
  when: webserver_type == 'apache'
  notify: Restart apache2

- name: Ensure Apache2 is running and enabled
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
  when: webserver_type == 'apache'


#
# Nginx
#

- name: Disable the Nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: webserver_type == 'nginx'
  notify: Restart nginx

- name: Enable the Drupal Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/drupal
    dest: /etc/nginx/sites-enabled/drupal
    state: link
  when: webserver_type == 'nginx'
  notify: Restart nginx

# Runs after the symlink is in place so it tests the configuration nginx will
# actually load. A template-level `validate` would test the pre-change state.
- name: Validate the Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  when: webserver_type == 'nginx'

- name: Ensure Nginx is running and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  when: webserver_type == 'nginx'

# The ACME HTTP-01 challenge is answered on port 80 by the vhost just written,
# so the web server has to be reloaded before certbot runs.
- name: Apply the pending web server restart before requesting a certificate
  ansible.builtin.meta: flush_handlers
