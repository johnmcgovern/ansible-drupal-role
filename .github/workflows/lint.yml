---
name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ansible-lint and yamllint
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install --disable-pip-version-check ansible-lint yamllint

      # ansible-lint resolves modules through the installed collections; without
      # these it reports every FQCN in the roles as an unknown module.
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: yamllint -c .yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      # Catches a sample that documents a variable no role defaults, which would
      # leave it undefined at run time for anyone who omits it. Runs in
      # --sample-only mode because group_vars/all is gitignored and absent here.
      - name: Check group_vars sample against role defaults
        run: tests/check-vars-drift.py --sample-only
