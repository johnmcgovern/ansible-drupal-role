---
# Upgrades an installed Drupal site in place.
#
#   ansible-playbook -i hosts upgrade.yml
#   ansible-playbook -i hosts upgrade.yml -e upgrade_target='^11.5'
#   ansible-playbook -i hosts upgrade.yml --check
#
# site.yml deliberately never moves an installed site forward: it skips the
# codebase entirely once composer.json exists, so a converged host stays on the
# release it was built with. Upgrading is a deliberate, ordered operation with a
# database step in the middle, so it lives here rather than being a side effect
# of a routine deploy.
#
# Order matters and is the documented Drupal sequence: back up, take the site
# offline, update the code, run database updates, rebuild caches, come back
# online. Running updatedb against a live site risks serving requests through a
# half-migrated schema.

- name: Upgrade Drupal
  hosts: webservers
  become: true
  gather_facts: true

  # Prefixed so they cannot shadow the deployment's own variables. Play vars
  # outrank group_vars, so reusing the real names here would silently override
  # the host's configuration -- a mistake already made once in tests/verify.yml.
  vars:
    upgrade_base_path: "{{ drupal_base_path | default('/var/www/drupal') }}"
    upgrade_drush: "{{ upgrade_base_path }}/vendor/bin/drush"
    # Absolute path: Red Hat's sudoers secure_path excludes /usr/local/bin, so
    # a bare `composer` is not found under become. See roles/drupal/defaults.
    upgrade_composer: "{{ composer_bin | default('/usr/local/bin/composer') }}"
    # Same OS-derived fallback the roles use: Debian's nginx runs as www-data,
    # Red Hat's as nginx. A bare 'www-data' default here means every drush call
    # below runs as a user that does not exist on a Red Hat host.
    upgrade_web_user: >-
      {{ webserver_user
         | default('nginx' if ansible_facts['os_family'] == 'RedHat' else 'www-data') }}
    upgrade_web_group: >-
      {{ webserver_group
         | default('nginx' if ansible_facts['os_family'] == 'RedHat' else 'www-data') }}
    upgrade_config_sync: "{{ drupal_config_sync_path | default(upgrade_base_path ~ '/config/sync') }}"
    upgrade_composer_env:
      COMPOSER_HOME: /root/.composer
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_NO_INTERACTION: "1"
    upgrade_drush_env:
      HOME: /tmp

    # Empty updates within the constraints already in composer.json, which moves
    # patch and minor releases inside the current major. Set to a constraint such
    # as '^11.5' to move to a new minor or major, which rewrites the core
    # requirements the way Drupal's upgrade documentation prescribes.
    upgrade_target: ""

    # Take a backup first. There is no reason to skip this other than having
    # just taken one by hand.
    upgrade_backup: true

    # Bring the project's allow-plugins list up to what the target release's
    # own template declares, so that a series introducing a new Composer plugin
    # does not abort the upgrade half-way. Only consulted when upgrade_target is
    # set, because updating within existing constraints cannot change the
    # template. Set false to manage composer.json by hand.
    upgrade_sync_allow_plugins: true
    upgrade_template_dir: /tmp/drupal-upgrade-template

    # Permit upgrading onto a development or pre-release branch. Same meaning
    # and the same warnings as drupal_allow_unstable in roles/drupal/defaults;
    # defaults to whatever the host's configuration says so that one setting
    # governs both playbooks.
    upgrade_allow_unstable: "{{ drupal_allow_unstable | default(false) }}"
    upgrade_unstable_pattern: '^dev-|-dev$|-(alpha|beta|rc)'

    # Maintenance mode during the database update. Turning this off shortens the
    # outage but serves requests against a partially migrated schema.
    upgrade_maintenance_mode: true

  tasks:

    # Read into its own namespace rather than injected: include_vars outranks
    # group_vars, so pulling the whole file into scope would override a host's
    # real configuration with role defaults. This way the Drupal/PHP requirement
    # table has exactly one definition -- roles/drupal/defaults/main.yml -- and
    # this playbook consults it instead of keeping a second copy to drift.
    - name: Read the Drupal/PHP requirement table from the drupal role
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/roles/drupal/defaults/main.yml"
        name: upgrade_role_defaults
      delegate_to: localhost
      become: false
      run_once: true

    - name: Determine the PHP version on this host
      ansible.builtin.command:
        cmd: php -r "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;"
      register: upgrade_php_probe
      changed_when: false

    # An upgrade_target names a release series deliberately, so a host that
    # cannot run it should say which PHP it would need -- not hand back a
    # Composer dependency-solver transcript that mentions php once, near the end.
    - name: Assert this host's PHP can run the requested Drupal series
      ansible.builtin.assert:
        that:
          - upgrade_requirements[upgrade_target_major] is version(upgrade_php, '<=')
        fail_msg: >-
          upgrade_target is "{{ upgrade_target }}", which is Drupal
          {{ upgrade_target_major }} and requires PHP
          {{ upgrade_requirements[upgrade_target_major] }}. This host has PHP
          {{ upgrade_php }}, so Composer could not resolve it. Upgrade the
          platform first, or choose a series this PHP can run.
        success_msg: >-
          PHP {{ upgrade_php }} satisfies Drupal {{ upgrade_target_major }}
          (needs {{ upgrade_requirements[upgrade_target_major] }}).
      vars:
        upgrade_php: "{{ upgrade_php_probe.stdout | trim }}"
        upgrade_requirements: "{{ upgrade_role_defaults.drupal_php_requirements }}"
        upgrade_target_major: "{{ upgrade_target | regex_search('[0-9]+') }}"
      when:
        - upgrade_target | length > 0
        - upgrade_target_major in upgrade_requirements

    # Composer will not resolve a non-stable constraint unless the project's
    # own minimum-stability allows it, so an upgrade onto a development branch
    # needs both this opt-in and a project created with it.
    - name: Fail when upgrading onto a development branch without opting in
      ansible.builtin.fail:
        msg: >-
          upgrade_target is "{{ upgrade_target }}", which is a development or
          pre-release constraint, but drupal_allow_unstable is false. Set it
          true to allow this -- and read what it costs in
          roles/drupal/defaults/main.yml -- or choose a stable constraint.
      when:
        - upgrade_target | length > 0
        - upgrade_target is search(upgrade_unstable_pattern)
        - not (upgrade_allow_unstable | bool)

    - name: Assert Drupal is installed on this host
      ansible.builtin.stat:
        path: "{{ upgrade_base_path }}/composer.json"
      register: upgrade_composer_json
      failed_when: not upgrade_composer_json.stat.exists

    - name: Confirm the site bootstraps before touching anything
      ansible.builtin.command:
        cmd: "{{ upgrade_drush }} status --field=bootstrap"
        chdir: "{{ upgrade_base_path }}"
      become: true
      become_user: "{{ upgrade_web_user }}"
      environment: "{{ upgrade_drush_env }}"
      register: upgrade_bootstrap
      changed_when: false
      failed_when: "'Successful' not in upgrade_bootstrap.stdout"

    - name: Record the version before upgrading
      ansible.builtin.command:
        cmd: "{{ upgrade_drush }} status --field=drupal-version"
        chdir: "{{ upgrade_base_path }}"
      become: true
      become_user: "{{ upgrade_web_user }}"
      environment: "{{ upgrade_drush_env }}"
      register: upgrade_version_before
      changed_when: false

    - name: Report the starting point
      ansible.builtin.debug:
        msg: >-
          Upgrading Drupal {{ upgrade_version_before.stdout | trim }}
          {{ 'to ' ~ upgrade_target if upgrade_target else 'within its current constraints' }}.

    # A pre-upgrade backup is the whole rollback plan: composer can be reverted
    # from composer.lock, but a failed updatedb cannot be undone without the
    # database. drupal-restore.sh restores what this produces.
    - name: Take a pre-upgrade backup
      ansible.builtin.systemd_service:
        name: drupal-backup.service
        state: started
      when: upgrade_backup

    - name: Check the backup succeeded
      ansible.builtin.systemd_service:
        name: drupal-backup.service
      register: upgrade_backup_result
      changed_when: false
      failed_when: upgrade_backup_result.status.Result != 'success'
      when: upgrade_backup

    - name: Put the site into maintenance mode
      ansible.builtin.command:
        cmd: "{{ upgrade_drush }} state:set system.maintenance_mode 1 --input-format=integer"
        chdir: "{{ upgrade_base_path }}"
      become: true
      become_user: "{{ upgrade_web_user }}"
      environment: "{{ upgrade_drush_env }}"
      changed_when: true
      when: upgrade_maintenance_mode

    # From here on a failure leaves the site in maintenance mode, so the rest is
    # wrapped to guarantee it is taken back out.
    - name: Perform the upgrade
      block:

        - name: Update Drupal core within its current constraints
          ansible.builtin.command:
            cmd: >-
              {{ upgrade_composer }} update "drupal/core-*"
              --with-all-dependencies --no-interaction
            chdir: "{{ upgrade_base_path }}"
          environment: "{{ upgrade_composer_env }}"
          when: not upgrade_target
          changed_when: true

        # A new release series can introduce Composer plugins the project has
        # never seen, and Composer refuses to run any plugin absent from the
        # project's allow-plugins list. That list is written once, when
        # create-project scaffolds the site, and `composer require` never
        # revisits it -- so the upgrade dies with
        #
        #   symfony/runtime contains a Composer plugin which is blocked by your
        #   allow-plugins config
        #
        # *after* it has already rewritten composer.json, leaving the constraint
        # pointing at a release that is not installed. Observed moving 11.3.16
        # to ^11.4, where 11.4's template adds symfony/runtime.
        #
        # The target release's own template is the authority on what it needs,
        # so it is fetched and compared rather than the missing names being
        # hardcoded here -- a future release that adds a different plugin then
        # needs no change. Permitting a plugin lets it execute code during
        # install, so the ones being added are named in the output rather than
        # slipped in quietly; set upgrade_sync_allow_plugins to false to manage
        # the list by hand instead.
        - name: Reconcile allow-plugins with the target release
          when:
            - upgrade_sync_allow_plugins
            - upgrade_target | length > 0
          block:

            - name: Fetch the target release's project template
              ansible.builtin.command:
                cmd: >-
                  {{ upgrade_composer }} create-project --no-install --no-scripts
                  --stability {{ 'dev' if (upgrade_allow_unstable | bool) else 'stable' }}
                  drupal/recommended-project:{{ upgrade_target }}
                  {{ upgrade_template_dir }}
                creates: "{{ upgrade_template_dir }}/composer.json"
              environment: "{{ upgrade_composer_env }}"

            - name: Read both manifests
              ansible.builtin.slurp:
                src: "{{ item }}"
              register: upgrade_manifests
              loop:
                - "{{ upgrade_template_dir }}/composer.json"
                - "{{ upgrade_base_path }}/composer.json"

            - name: Work out which plugins the target release adds
              ansible.builtin.set_fact:
                upgrade_new_plugins: >-
                  {{ (upgrade_target_plugins | list)
                     | difference(upgrade_current_plugins | list) }}
              vars:
                upgrade_target_plugins: >-
                  {{ (upgrade_manifests.results[0].content | b64decode | from_json).config['allow-plugins']
                     | default({}) }}
                upgrade_current_plugins: >-
                  {{ (upgrade_manifests.results[1].content | b64decode | from_json).config['allow-plugins']
                     | default({}) }}

            - name: Report the Composer plugins being permitted
              ansible.builtin.debug:
                msg: >-
                  Drupal {{ upgrade_target }} adds Composer
                  plugin{{ 's' if upgrade_new_plugins | length > 1 else '' }}
                  {{ upgrade_new_plugins | join(', ') }} to its project template.
                  Permitting {{ 'them' if upgrade_new_plugins | length > 1 else 'it' }}
                  in composer.json, without which the upgrade cannot install.
              when: upgrade_new_plugins | length > 0

            - name: Permit the Composer plugins the target release adds
              ansible.builtin.command:
                cmd: "{{ upgrade_composer }} config allow-plugins.{{ item }} true"
                chdir: "{{ upgrade_base_path }}"
              environment: "{{ upgrade_composer_env }}"
              loop: "{{ upgrade_new_plugins }}"
              changed_when: true

            - name: Remove the fetched template
              ansible.builtin.file:
                path: "{{ upgrade_template_dir }}"
                state: absent

        # A project scaffolded from a stable release carries
        # "minimum-stability": "stable", and Composer applies that to the whole
        # dependency graph -- so requiring a dev branch fails with
        #
        #   drupal/core 12.x-dev ... does not match your minimum-stability
        #
        # no matter what --stability the original create-project used. Opting in
        # to an unstable target therefore has to relax the project itself, not
        # just the command line.
        #
        # prefer-stable alongside it is what keeps this from being reckless:
        # Composer still takes the stable release of everything that has one,
        # and only falls back to a dev version where no stable release exists --
        # which, for this upgrade, is Drupal core alone.
        - name: Allow non-stable packages in the project
          when:
            - upgrade_allow_unstable | bool
            - upgrade_target is search(upgrade_unstable_pattern)
          block:

            - name: Read the project's current stability settings
              ansible.builtin.slurp:
                src: "{{ upgrade_base_path }}/composer.json"
              register: upgrade_stability_manifest

            # Remembered so the always: block below can put them back. Relaxing
            # stability and then failing the upgrade would leave the project
            # permanently willing to install dev versions of anything -- a
            # change the operator never asked for, on a site still running the
            # release it started on.
            - name: Remember the stability settings so a failure can restore them
              ansible.builtin.set_fact:
                upgrade_stability_before: >-
                  {{ {'minimum-stability':
                        (upgrade_stability_manifest.content | b64decode | from_json)['minimum-stability']
                        | default('stable'),
                      'prefer-stable':
                        (upgrade_stability_manifest.content | b64decode | from_json)['prefer-stable']
                        | default(false) | string | lower} }}

            - name: Relax minimum-stability and keep preferring stable releases
              ansible.builtin.command:
                cmd: "{{ upgrade_composer }} config {{ item.key }} {{ item.value }}"
                chdir: "{{ upgrade_base_path }}"
              environment: "{{ upgrade_composer_env }}"
              loop:
                - {key: minimum-stability, value: dev}
                - {key: prefer-stable, value: "true"}
              loop_control:
                label: "{{ item.key }}={{ item.value }}"
              when: upgrade_stability_before[item.key] != item.value
              changed_when: true

        # Moving to a new minor or major means rewriting the core requirements,
        # not just updating within them. These three packages are what
        # drupal/recommended-project pins, and they must move together.
        - name: Move Drupal core to a new constraint
          ansible.builtin.command:
            cmd: >-
              {{ upgrade_composer }} require
              drupal/core-recommended:{{ upgrade_target }}
              drupal/core-composer-scaffold:{{ upgrade_target }}
              drupal/core-project-message:{{ upgrade_target }}
              --update-with-all-dependencies --no-interaction
            chdir: "{{ upgrade_base_path }}"
          environment: "{{ upgrade_composer_env }}"
          when: upgrade_target | length > 0
          changed_when: true

        - name: Record that core actually moved
          ansible.builtin.set_fact:
            upgrade_core_moved: true

        # Composer wrote as root. Hand the tree back before Drupal runs, or the
        # web server cannot write its caches afterwards.
        - name: Reset ownership of the Drupal tree
          ansible.builtin.file:
            path: "{{ upgrade_base_path }}"
            state: directory
            owner: root
            group: "{{ upgrade_web_group }}"
            recurse: true

        - name: Restore the writable directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: "{{ upgrade_web_user }}"
            group: "{{ upgrade_web_group }}"
            recurse: true
          loop:
            - "{{ upgrade_base_path }}/web/sites/default/files"
            - "{{ upgrade_config_sync }}"

        - name: Run database updates
          ansible.builtin.command:
            cmd: "{{ upgrade_drush }} updatedb --yes"
            chdir: "{{ upgrade_base_path }}"
          become: true
          become_user: "{{ upgrade_web_user }}"
          environment: "{{ upgrade_drush_env }}"
          register: upgrade_updatedb
          changed_when: "'No pending updates' not in upgrade_updatedb.stdout"

        - name: Rebuild caches
          ansible.builtin.command:
            cmd: "{{ upgrade_drush }} cache:rebuild"
            chdir: "{{ upgrade_base_path }}"
          become: true
          become_user: "{{ upgrade_web_user }}"
          environment: "{{ upgrade_drush_env }}"
          changed_when: true

      always:
        # Composer reverts composer.json and composer.lock itself when a require
        # fails, but it knows nothing about the stability keys set above -- those
        # were written by a separate `composer config` call that succeeded. Put
        # them back, or a failed upgrade silently leaves the project accepting
        # dev releases of every dependency it has.
        - name: Restore the stability settings if the upgrade did not complete
          ansible.builtin.command:
            cmd: "{{ upgrade_composer }} config {{ item.key }} {{ item.value }}"
            chdir: "{{ upgrade_base_path }}"
          environment: "{{ upgrade_composer_env }}"
          loop:
            - {key: minimum-stability, value: "{{ upgrade_stability_before['minimum-stability'] | default('stable') }}"}
            - {key: prefer-stable, value: "{{ upgrade_stability_before['prefer-stable'] | default('true') }}"}
          loop_control:
            label: "{{ item.key }}={{ item.value }}"
          when:
            - upgrade_stability_before is defined
            - not (upgrade_core_moved | default(false))
          changed_when: true

        - name: Take the site out of maintenance mode
          ansible.builtin.command:
            cmd: "{{ upgrade_drush }} state:set system.maintenance_mode 0 --input-format=integer"
            chdir: "{{ upgrade_base_path }}"
          become: true
          become_user: "{{ upgrade_web_user }}"
          environment: "{{ upgrade_drush_env }}"
          changed_when: true
          when: upgrade_maintenance_mode

    - name: Refresh update data so the status report reflects the new version
      ansible.builtin.command:
        cmd: "{{ upgrade_drush }} php:eval \"\\Drupal::service('update.manager')->refreshUpdateData();\""
        chdir: "{{ upgrade_base_path }}"
      become: true
      become_user: "{{ upgrade_web_user }}"
      environment: "{{ upgrade_drush_env }}"
      changed_when: true

    - name: Drain the update fetch queue
      ansible.builtin.command:
        cmd: "{{ upgrade_drush }} cron"
        chdir: "{{ upgrade_base_path }}"
      become: true
      become_user: "{{ upgrade_web_user }}"
      environment: "{{ upgrade_drush_env }}"
      changed_when: true

    - name: Record the version after upgrading
      ansible.builtin.command:
        cmd: "{{ upgrade_drush }} status --field=drupal-version"
        chdir: "{{ upgrade_base_path }}"
      become: true
      become_user: "{{ upgrade_web_user }}"
      environment: "{{ upgrade_drush_env }}"
      register: upgrade_version_after
      changed_when: false

    - name: Assert the site still bootstraps
      ansible.builtin.command:
        cmd: "{{ upgrade_drush }} status --field=bootstrap"
        chdir: "{{ upgrade_base_path }}"
      become: true
      become_user: "{{ upgrade_web_user }}"
      environment: "{{ upgrade_drush_env }}"
      register: upgrade_bootstrap_after
      changed_when: false
      failed_when: "'Successful' not in upgrade_bootstrap_after.stdout"

    - name: Report the result
      ansible.builtin.debug:
        msg: >-
          {{ upgrade_version_before.stdout | trim }} ->
          {{ upgrade_version_after.stdout | trim }}
          {{ '(no change: already at the newest release allowed by composer.json)'
             if (upgrade_version_before.stdout | trim) == (upgrade_version_after.stdout | trim)
             else '' }}
